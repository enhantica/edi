# The crysta SDK update (edi ADR-0017). Every 30 minutes, and whenever crysta's
# `publish` job dispatches it after a push to crysta main, this finds the newest build-<sha> prerelease on
# crysta main that is newer than edi's pin, pushes `crysta-sdk/<sha12>` from edi main with only the pin
# lines changed, and dispatches ci.yml on it: a push by this job's token starts no pull_request run, and
# the dispatched run is a full one. The maintainers open the PR (the org does not let Actions open
# pull requests) and merges it through its merge guard (`merge-when-gated.sh --pin-update`) on that CI
# evidence. Superseded update branches are deleted only when a complete open-PR listing, read with this
# token's `pull-requests: read`, proves no open PR uses them.
#
# It runs on the project's own runners and reaches GitHub with curl, as the other jobs do; the
# runners have no `gh`.
name: crysta SDK update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: crysta-sdk-update
  cancel-in-progress: false

jobs:
  update:
    name: crysta SDK update
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      # The crysta App token: contents-read on crysta, for its releases and its main history.
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
      - name: Clone crysta main (the order of its builds)
        env:
          CRYSTA_TOKEN: ${{ steps.crysta-token.outputs.token }}
        run: >-
          git clone --filter=blob:none --no-checkout
          "https://x-access-token:${CRYSTA_TOKEN}@github.com/enhantica/crysta.git" "$RUNNER_TEMP/crysta"
      # A runner keeps its workspace between runs, local branches included. Proposals live on origin,
      # so a local update branch an earlier run left is dropped rather than read as a held one.
      - name: Drop local update branches an earlier run left
        run: |
          git for-each-ref --format='%(refname:short)' refs/heads/crysta-sdk/ |
            xargs -r git branch -D
      - name: Propose the newest crysta build; prune superseded update branches
        env:
          CRYSTA_TOKEN: ${{ steps.crysta-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/ci/crysta_sdk_update.py --crysta-clone "$RUNNER_TEMP/crysta"
