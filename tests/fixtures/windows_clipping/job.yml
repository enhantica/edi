# Job fragment for the application workflow. The build job supplies both web kits.
windows-web-clipping:
  needs: app-wasm
  runs-on: windows-2025
  timeout-minutes: 15
  steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: edi-webapp
        path: build/wasm
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install the browser driver
      working-directory: tests/fixtures/web_parallel
      run: npm ci --ignore-scripts
    - name: Serve the delivered web application
      shell: pwsh
      run: |
        Expand-Archive build/wasm/edi-webapp.zip build/wasm/unpacked
        Start-Process python -ArgumentList @('tests/fixtures/windows_clipping/serve.py', 'build/wasm/unpacked', '8765') -RedirectStandardOutput server.log -RedirectStandardError server-errors.log
    - name: Check clips in Edge on Windows
      shell: pwsh
      run: |
        $env:EDI_BROWSER = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
        node tests/system/manual/windows_clipping.mjs http://127.0.0.1:8765 build/windows-clipping
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-web-clipping
        path: |
          build/windows-clipping
          server*.log
