# The macOS installer with an accessibility client reading it (edi #150): a released or built installer is walked
# through its pages by a controller script while a small client asks every element of its windows for several
# attributes at once, its selected children among them, as some assistive tools do; a crash fails the job and its
# report is kept. The released installer shows the crash; the installer built from this commit must not crash.
name: Installer accessibility

on:
  push:
    branches: ['scratch/installer-accessibility']
  workflow_dispatch:
    inputs:
      release:
        description: 'The edi release whose macOS online installer is checked'
        required: true
        default: 'v2026.11.29'
      asset:
        description: 'The installer disk image in that release'
        required: true
        default: 'EasyDiffraction-2026.11.29-macos-arm64-online.dmg'

permissions:
  contents: read

jobs:
  macos:
    name: installer accessibility · macOS
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE: ${{ inputs.release || 'v2026.11.29' }}
      ASSET: ${{ inputs.asset || 'EasyDiffraction-2026.11.29-macos-arm64-online.dmg' }}
    steps:
      - uses: actions/checkout@v5
      - name: Download and mount the installer
        id: mount
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p "$ASSET" -D "$RUNNER_TEMP"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/installer" "$RUNNER_TEMP/$ASSET"
          app="$(find "$RUNNER_TEMP/installer" -maxdepth 1 -name '*.app' | head -1)"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      # The released installer is expected to crash (edi #150); its log and report show the stack to compare.
      - name: Walk the installer with an accessibility client
        continue-on-error: true
        run: bash tools/installer/a11y-check.sh "${{ steps.mount.outputs.app }}" "$RUNNER_TEMP/a11y"
      # Diagnosis of edi #150 on a released installer: the same walk without the component selection page.
      - name: The same without the component selection page
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash tools/installer/a11y-check.sh "${{ steps.mount.outputs.app }}" "$RUNNER_TEMP/a11y-no-components" A11yHideComponents=true
      - name: Set up the locked packaging environment
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-pixi
        with:
          manifest-path: tools/installer/pixi.toml
      - name: Build the marker installer from this commit
        if: ${{ !cancelled() }}
        id: marker
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python tools/installer/package.py tools --output build/installer/ifw
          pixi run --manifest-path tools/installer/pixi.toml python tools/installer/capture_pages.py --tools build/installer/ifw/tools --output "$RUNNER_TEMP/marker" --marker-only | tee "$RUNNER_TEMP/marker.txt"
          echo "app=$(tail -1 "$RUNNER_TEMP/marker.txt")" >> "$GITHUB_OUTPUT"
      - name: Walk this commit's installer with the accessibility client
        if: ${{ !cancelled() && steps.marker.outputs.app != '' }}
        run: bash tools/installer/a11y-check.sh "${{ steps.marker.outputs.app }}" "$RUNNER_TEMP/a11y-this-commit" --own-script
      - name: Keep the logs and any crash report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-accessibility-macos
          path: |
            ${{ runner.temp }}/a11y
            ${{ runner.temp }}/a11y-no-components
            ${{ runner.temp }}/a11y-this-commit
          if-no-files-found: ignore
          retention-days: 7  # read when a check fails
