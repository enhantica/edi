# The verification notebook PAGES live in the docs tree; their FullProf reference DATA stays
# at knowledge/verification/fullprof beside the tests that read it. Jupytext .py sources
# never render as pages. A CLI project's own
# files (its project/ tree, PROVENANCE.md and any fullprof/ evidence) are inputs, not pages: each project's page is its
# docs/user/cli/<id>/index.md.
exclude_docs: |
  *.py
  /user/cli/*/project/
  /user/cli/*/PROVENANCE.md
  /user/cli/*/README.md
  /user/cli/*/fullprof/
  /user/cli/*/data/

# Defining `plugins` drops the implicit default, so `search` is restated explicitly.
# mkdocs-jupyter renders the Verification notebooks PRE-EXECUTED (the CI docs job runs
# notebook-exec-ci before docs-build); include_requirejs is required for the plotly figures.
# No copy of each notebook beside its page: a run tutorial is tens of MB, and the public site
# already offers it for download.
hooks:
  - tools/docs/features_projection_hook.py
  - tools/docs/notebook_frames_hook.py

plugins:
  - search
  - mkdocs-jupyter:
      include: ['*.ipynb']
      execute: false
      allow_errors: false
      include_source: false
      # The nav's short labels name the notebooks, not their first headings.
      ignore_h1_titles: true
      include_requirejs: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

# Link validation is relaxed (crysta precedent): the dev corpus carries many inline
# file-path references and repo-target links that are not mkdocs page links.
# Repo-level md link integrity is checked separately.
validation:
  nav:
    omitted_files: warn
    not_found: ignore
    absolute_links: ignore
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

extra_javascript:
  - assets/javascripts/audience.js

extra_css:
  - assets/stylesheets/audience.css
