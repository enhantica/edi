# The experiment types each row of the Features page applies to (owner record 2026-11-09). Each row is keyed by
# its link text; a text several rows share takes `occurrences`, one value per row in page order. A value is `all` (one "All types" tag) or a list
# of short tokens: pd and sc (sample form), neut and xray (probe), cwl and tof (beam mode). A dimension a row does
# not name applies to every value of it. `code` names the experiment setting the code accepts only for some types:
# the site build refuses a tag for a type that refuses the setting, as feature_applicability.json records it
# (written from the built module by tools/docs/feature_applicability.py and checked against it in CI).
rows:
  # Crystal structures
  From a CIF file: all
  From the Crystallography Open Database: all
  From EasyDiffraction’s collection: {occurrences: [all, [neut]]}
  Created by hand: {occurrences: [all, [neut], all]}
  From a saved project: {occurrences: [all, [neut], all]}
  # Magnetic structures (loading)
  From an `.edi` file: [neut]
  # Experiments
  A full experiment from a file: all
  A full experiment from the web: all
  Measured data from a file: all
  Measured data from the web: all
  Several datasets as experiments: all
  Several datasets as a scan: [pd]
