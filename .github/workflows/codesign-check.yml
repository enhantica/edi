name: Code signing credentials check

# Checks the macOS signing and notarisation secrets without building anything.
on:
  push:
    branches: [codesign-mac]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Import the certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.CODESIGN_MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CODESIGN_MAC_CERT_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p temp "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p temp "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: The identity is a valid signing identity with its private key
        env:
          IDENTITY: ${{ vars.CODESIGN_MAC_IDENTITY }}
          TEAM_ID: ${{ vars.CODESIGN_MAC_TEAM_ID }}
        run: |
          security find-identity -v -p codesigning "$KEYCHAIN" | tee identities.txt
          grep -F "\"$IDENTITY\"" identities.txt
          case "$IDENTITY" in *"($TEAM_ID)") ;; *) echo "identity and team id differ"; exit 1 ;; esac

      - name: Sign a small test binary
        env:
          IDENTITY: ${{ vars.CODESIGN_MAC_IDENTITY }}
        run: |
          cp /bin/echo "$RUNNER_TEMP/echo-copy"
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$RUNNER_TEMP/echo-copy"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/echo-copy"

      - name: The notarisation credentials are accepted
        env:
          APPLE_ID: ${{ secrets.CODESIGN_MAC_NOTARY_APPLE_ID }}
          PASSWORD: ${{ secrets.CODESIGN_MAC_NOTARY_PASSWORD }}
          TEAM_ID: ${{ vars.CODESIGN_MAC_TEAM_ID }}
        run: xcrun notarytool history --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM_ID" > history.txt && head -5 history.txt

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Decode the KeyLocker client certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.CODESIGN_WIN_CERT_P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/client.p12"
          echo "SM_CLIENT_CERT_FILE=$(cygpath -w "$RUNNER_TEMP/client.p12")" >> "$GITHUB_ENV"

      - name: Copy a small executable to sign
        shell: pwsh
        run: Copy-Item "$env:WINDIR\System32\where.exe" "$env:RUNNER_TEMP\sign-test.exe"

      - name: Sign it through KeyLocker
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
          input: ${{ runner.temp }}\sign-test.exe
          keypair-alias: ${{ vars.CODESIGN_WIN_KEYLOCKER_KEYPAIR_ALIAS }}
        env:
          SM_HOST: ${{ vars.CODESIGN_WIN_KEYLOCKER_HOST }}
          SM_API_KEY: ${{ secrets.CODESIGN_WIN_KEYLOCKER_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.CODESIGN_WIN_CERT_P12_PASSWORD }}

      - name: The signature verifies
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName verify /pa /v "$env:RUNNER_TEMP\sign-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-AuthenticodeSignature "$env:RUNNER_TEMP\sign-test.exe").SignerCertificate.Subject

      - name: Remove the client certificate
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/client.p12"
