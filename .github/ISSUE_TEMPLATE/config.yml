# Every issue starts from a form, so it carries the labels triage reads (docs/dev/adrs/0101-issue-labels.md).
blank_issues_enabled: false
contact_links:
  - name: Security problem
    url: https://github.com/enhantica/edi/security
    about: Report it privately with Report a vulnerability, never in a public issue.
  - name: Feedback without a GitHub account
    url: https://easydiffraction.org
    about: Use the Feedback form in the app or the form on the website.
