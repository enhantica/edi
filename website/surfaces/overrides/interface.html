{% extends "gui.html" %}
{% block htmltitle %}
  {% if page.meta and page.meta.html_title %}
    <title>{{ page.meta.html_title }} - {{ config.site_name }}</title>
  {% else %}
    {{ super() }}
  {% endif %}
{% endblock %}
{% block extrahead %}
  {{ super() }}
  <link rel="stylesheet" href="{{ 'assets/interfaces.css' | url }}?v={{ config.extra.gui_assets_version }}">
{% endblock %}
