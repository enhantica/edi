# The site on GitHub Pages: the public site (website/) at the root, the contributor documentation (mkdocs.yml) at
# /dev/ and the web app at /webapp/. The site is built from main (or
# by dispatch) with the notebooks executed for rendering, which needs crysta's SDK; the web app is built
# as CI's `app · WebAssembly` job builds it and placed into the site (ADR-0023). A dispatch may name a
# crysta commit to build the web app from instead of the pinned SDK, for a preview of unreleased crysta work;
# the notebooks are then published unexecuted, as the native build would use the pin.
name: Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      component:
        description: Site component to build and publish
        type: choice
        options: [docs, wasm, all]
        default: docs
      crysta_commit:
        description: Build the web app from this crysta commit (a full sha) instead of the pinned SDK
        required: false
        default: ''

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  refresh-release-notes:
    if: github.repository == 'enhantica/edi' && github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_REF: ${{ github.event.release.prerelease && vars.EDI_PREVIEW_PAGES_REF || github.event.repository.default_branch }}
      PREVIEW_CRYSTA_COMMIT: ${{ github.event.release.prerelease && vars.EDI_PREVIEW_CRYSTA_COMMIT || '' }}
    steps:
      - run: |
          args=(-f component=docs)
          if [[ -n "$PREVIEW_CRYSTA_COMMIT" ]]; then
            args+=(-f "crysta_commit=$PREVIEW_CRYSTA_COMMIT")
          fi
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$PAGES_REF" "${args[@]}"

  docs:
    name: build documentation
    if: github.repository == 'enhantica/edi' && github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.component != 'wasm')
    environment: crysta-sdk
    runs-on: &linux ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Check independent publication
        run: pixi run pages-check
      - name: Prepare notebooks
        run: pixi run notebook-prepare
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Check the crysta commit
        if: inputs.crysta_commit != ''
        run: |
          [[ "$CRYSTA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "crysta_commit must be a full 40-hex sha"; exit 1; }
        env:
          CRYSTA_COMMIT: ${{ inputs.crysta_commit }}
      - name: Build the native code
        if: inputs.crysta_commit == ''
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Execute notebooks for rendering
        if: inputs.crysta_commit == ''
        run: pixi run notebook-exec-ci
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Strict contributor docs build  # mkdocs.yml writes site/dev
        run: pixi run docs-build
      - name: Build the public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/edi-releases.json"
          pixi run site-build --base-url https://enhantica.github.io/edi/ --github-releases "$RUNNER_TEMP/edi-releases.json"
      - name: Place the public site at the root
        run: |
          for path in dev webapp; do
            [ ! -e "website/_build/$path" ] || { echo "the public site must not own /$path/"; exit 1; }
          done
          cp -R website/_build/. site/
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: pages-docs
          path: site
          include-hidden-files: true
          if-no-files-found: error

  wasm:
    name: build WebAssembly
    if: github.repository == 'enhantica/edi' && github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.component != 'docs')
    environment: crysta-sdk
    runs-on: *linux
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Check the crysta commit
        if: inputs.crysta_commit != ''
        run: |
          [[ "$CRYSTA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "crysta_commit must be a full 40-hex sha"; exit 1; }
        env:
          CRYSTA_COMMIT: ${{ inputs.crysta_commit }}
      - name: Check out crysta for the web app
        if: inputs.crysta_commit != ''
        uses: actions/checkout@v5
        with:
          repository: enhantica/crysta
          ref: ${{ inputs.crysta_commit }}
          token: ${{ steps.crysta-token.outputs.token }}
          path: crysta-source
      - name: Fetch the pinned crysta source
        if: inputs.crysta_commit == ''
        run: pixi run crysta-sdk
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Install the WebAssembly toolchain  # Emscripten, Qt's wasm kits, Eigen, Chrome
        run: pixi run -e app wasm-toolchain
      - name: Build both kits and pack the web app
        run: pixi run -e app --skip-deps wasm-build
        env:
          EDI_WASM_CRYSTA_SRC: ${{ inputs.crysta_commit != '' && format('{0}/crysta-source', github.workspace) || '' }}
      - name: Upload WebAssembly
        uses: actions/upload-artifact@v4
        with:
          name: pages-webapp
          path: build/wasm/site
          include-hidden-files: true
          if-no-files-found: error

  publish-docs:
    name: publish documentation
    needs: docs
    if: github.event.repository.private == false
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: *linux
    steps:
      - uses: actions/checkout@v5
      - name: Download new documentation
        uses: actions/download-artifact@v4
        with:
          name: pages-docs
          path: documentation
      - name: Preserve the deployed counterpart and assemble the site
        run: python3 tools/ci/pages_update.py --repo "$GITHUB_REPOSITORY" --component docs --incoming documentation --site site
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the documentation site
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-site-docs-${{ github.run_attempt }}
          path: site
          retention-days: 90
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-site-docs-${{ github.run_attempt }}

  publish-wasm:
    name: publish WebAssembly
    needs: wasm
    if: github.event.repository.private == false
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: *linux
    steps:
      - uses: actions/checkout@v5
      - name: Download new WebAssembly
        uses: actions/download-artifact@v4
        with:
          name: pages-webapp
          path: webapp
      - name: Preserve the deployed counterpart and assemble the site
        run: python3 tools/ci/pages_update.py --repo "$GITHUB_REPOSITORY" --component wasm --incoming webapp --site site
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the WebAssembly site
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-site-wasm-${{ github.run_attempt }}
          path: site
          retention-days: 90
      - name: Deploy WebAssembly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-site-wasm-${{ github.run_attempt }}
