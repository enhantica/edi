# Developer environment for GSAS-II reference exports and converter fixtures.
[workspace]
name = "edi-gsas-ii"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = "==0.76.2"

[dependencies]
python = "3.12.*"
numpy = "2.2.*"
scipy = "*"
pycifrw = "*"
c-compiler = "*"
fortran-compiler = "*"
pkg-config = "*"

[pypi-dependencies]
gsas-ii = { git = "https://github.com/AdvancedPhotonSource/GSAS-II.git", rev = "46b3d7b541d344f9506848c37b35737b1a87ddac" }
