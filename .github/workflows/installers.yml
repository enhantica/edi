name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      prepare_preview_release:
        description: Build and test all three installers for a new prerelease draft
        default: false
        type: boolean
      publish_components:
        description: Deploy qualified online installer components to the public testing repository
        default: false
        type: boolean
      preview_run:
        description: >-
          Installer run ID whose qualified installers to reuse without rebuilding: deployed with publish_components,
          attached to the prerelease draft with prepare_preview_release
        type: string
      release_plan_run:
        description: Prepare calendar release run ID for stable qualification at the same commit
        type: string
      windows_only:
        description: Build and test Windows only for diagnosis
        default: false
        type: boolean
      capture_pages:
        description: Only capture every installer and maintenance tool page, light and dark, on Linux, macOS and Windows
        default: false
        type: boolean
      capture_linux_only:
        description: With capture_pages, capture Linux only (a quick look while the pages change)
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/workflows/installers.yml
      - .github/actions/setup-pixi/action.yml
      - tools/installer/**
      - cmake/assistant_runtime*
      - app/src/installer_smoke.cpp

  pull_request:
    types: [ready_for_review]
    paths:
      - .github/workflows/installers.yml
      - .github/actions/setup-pixi/action.yml
      - tools/installer/**
      - cmake/assistant_runtime*
      - app/src/installer_smoke.cpp

permissions:
  contents: read
  actions: read

# A release build (a prerelease draft or a calendar release's qualification) queues with Tests' main pushes
# (ci.yml) instead of running beside them.
concurrency:
  group: ${{ (inputs.prepare_preview_release || inputs.release_plan_run) && 'edi-main-push-and-release' || format('desktop-installers-{0}', github.event_name == 'push' && github.ref || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
  queue: ${{ (inputs.prepare_preview_release || inputs.release_plan_run) && 'max' || 'single' }}

jobs:
  # The crysta SDK, built once per crysta commit (edi ADR-0083).
  crysta-sdk:
    uses: ./.github/workflows/crysta-sdk.yml
    secrets: inherit

  preview-version:
    if: github.event.pull_request.head.repo.fork == false && inputs.prepare_preview_release && inputs.preview_run == ''
    environment: crysta-sdk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.select.outputs.version }}
      date: ${{ steps.select.outputs.date }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Reserve this source's calendar version
        id: select
        env:
          # Reserving creates an empty draft, which needs the release token used for drafts.
          GH_TOKEN: ${{ secrets.GH_API_PERSONAL_ACCESS_TOKEN }}
          PYTHONPATH: tools/release
        run: |
          python - <<'PYTHON'
          import datetime
          import os
          from pathlib import Path
          from prepare import reserve_identity
          today = datetime.datetime.now(datetime.UTC).date()
          version, date = reserve_identity(
              os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'], today, prerelease=True
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\ndate={date.isoformat()}\n')
          PYTHON

  installers:
    needs: [preview-version, crysta-sdk]
    if: >-
      github.event.pull_request.head.repo.fork == false && !cancelled() && inputs.preview_run == '' && !inputs.capture_pages
      && (needs.preview-version.result == 'success' || needs.preview-version.result == 'skipped')
    name: installer · ${{ matrix.runner == 'windows-2022' && 'Windows' || matrix.runner == 'macos-15' && 'macOS' || 'Linux' }}
    # A signing run takes the codesign environment (main only); every other run, pull requests included, keeps
    # crysta-sdk. The condition is EDI_CODESIGN's below (edi ADR-0091).
    environment: >-
      ${{ github.repository == 'enhantica/edi' && github.ref == 'refs/heads/main'
      && github.event_name == 'workflow_dispatch'
      && (inputs.release_plan_run != '' || inputs.prepare_preview_release)
      && 'codesign' || 'crysta-sdk' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Every platform is written out; a Windows diagnostic (windows_only) drops Linux and macOS.
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
        exclude:
          - runner: ${{ inputs.windows_only && 'ubuntu-24.04' || 'none' }}
          - runner: ${{ inputs.windows_only && 'macos-15' || 'none' }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      EDI_INSTALLER_PREVIEW_DATE: ${{ needs.preview-version.outputs.date }}
      EDI_RELEASE_PLAN: ${{ inputs.release_plan_run && format('{0}/build/release-plan', github.workspace) || '' }}
      EDI_INSTALLER_VERSION: 0.0.${{ github.run_number }}.${{ github.run_attempt }}
      # Signing runs only for release builds started on main (a release plan or a preview-release preparation),
      # never for a push, a pull request, a fork or another branch (edi ADR-0091); build.py and package.py read it.
      EDI_CODESIGN: >-
        ${{ github.repository == 'enhantica/edi' && github.ref == 'refs/heads/main'
        && github.event_name == 'workflow_dispatch'
        && (inputs.release_plan_run != '' || inputs.prepare_preview_release)
        && '1' || '' }}
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    steps:
      - name: Apply the prerelease version
        if: inputs.prepare_preview_release
        shell: bash
        env:
          RELEASE_PLAN_RUN: ${{ inputs.release_plan_run }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
          PREVIEW_VERSION: ${{ needs.preview-version.outputs.version }}
        run: |
          if [[ -n "$RELEASE_PLAN_RUN" || "$WINDOWS_ONLY" == true ]]; then
            echo "A calendar preview is separate from stable qualification and Windows diagnostics."
            exit 1
          fi
          [[ -n "$PREVIEW_VERSION" ]]
          printf 'EDI_INSTALLER_VERSION=%s\nEDI_INSTALLER_PREVIEW_VERSION=%s\n' "$PREVIEW_VERSION" "$PREVIEW_VERSION" >> "$GITHUB_ENV"
      - name: Reject publication inputs for a Windows diagnostic
        if: inputs.windows_only && (inputs.publish_components || inputs.release_plan_run != '')
        shell: bash
        run: |
          echo "Windows diagnostics cannot publish or qualify a release."
          exit 1
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up the locked packaging environment
        uses: ./.github/actions/setup-pixi
        with:
          manifest-path: tools/installer/pixi.toml
      - name: Set up the Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'
      # The compiler cache, kept per platform between runs: a re-run of the same or a nearby commit compiles only
      # what changed. ccache hands back the object the compiler wrote for the same input, so the release bytes
      # do not depend on it. Keyed on the packaging lock, which fixes the compilers; restored from the newest entry.
      - name: Turn on the compiler cache
        shell: bash
        run: |
          {
            echo "CCACHE_DIR=${{ runner.temp }}/edi-ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >>"$GITHUB_ENV"
      - id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/edi-ccache
          key: ccache2-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/installer/pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/installer/pixi.lock') }}-
            ccache2-installer-${{ runner.os }}-${{ runner.arch }}-
      - name: Acquire source-bound release inputs
        if: inputs.release_plan_run != ''
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/release/download_plan.py" --repo "$GITHUB_REPOSITORY" --run "$PREPARE_RUN" --output "$EDI_RELEASE_PLAN"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN: ${{ inputs.release_plan_run }}
      - name: Validate calendar release policy offline
        shell: bash
        run: pixi run --manifest-path tools/installer/pixi.toml python -m pytest "${{ github.workspace }}/tests/fixtures/releases" --noconftest -o addopts= -o python_files="check_*.py" --ignore="${{ github.workspace }}/tests/fixtures/releases/check_notebook_package_origin.py" -q
      - name: Check installer boundaries and native UTC conversion offline
        shell: bash
        run: pixi run --manifest-path tools/installer/pixi.toml python -m pytest "${{ github.workspace }}/tests/fixtures/installer" --noconftest -o addopts= -o python_files="check_*.py" -q
      - name: Acquire the pinned Qt Installer Framework
        shell: bash
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" tools --output "${{ github.workspace }}/build/installer/ifw"
      - name: Check installer transport before building the application
        shell: bash
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/protocol_check.py" --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/protocol"
      - name: The pinned crysta commit
        shell: bash
        run: echo "CRYSTA_SOURCE_COMMIT=$(sed -n 's/^CRYSTA_COMMIT = "\([0-9a-f]\{40\}\)" *$/\1/p' pixi.toml)" >>"$GITHUB_ENV"
      - name: Require an immutable engine source
        shell: bash
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import os, re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['CRYSTA_SOURCE_COMMIT']):
              raise RuntimeError('Installer qualification requires a complete engine commit')
          PYTHON
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ runner.os == 'Windows' && 'win-64' || runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - name: crysta's source, whose lines no later step prints or stores
        uses: ./.github/actions/crysta-source
        with:
          sha: ${{ env.CRYSTA_SOURCE_COMMIT }}
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.CRYSTA_READ_KEY }}
      - name: Unpack the pinned crysta source
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python tools/ci/crysta_source_export.py "$CRYSTA_SRC" "$CRYSTA_SOURCE_COMMIT" .crysta
          printf '%s\n' "$CRYSTA_SOURCE_COMMIT" >.crysta/CRYSTA_SOURCE_SHA
      - name: Check engine compiler portability before the full build
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/build.py" --check-compiler --crysta-source "${{ github.workspace }}/.crysta" --work "${{ github.workspace }}/build/installer"
      - name: Fetch the data collection for the offline copy
        run: git clone --depth 1 https://github.com/enhantica/edi-data "${{ github.workspace }}/.edi-data"
      - name: Import the macOS signing certificate
        if: github.event.pull_request.head.repo.fork == false && env.EDI_CODESIGN == '1' && runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CODESIGN_MAC_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CODESIGN_MAC_CERT_P12_PASSWORD }}
      - name: Decode the KeyLocker client certificate
        if: github.event.pull_request.head.repo.fork == false && env.EDI_CODESIGN == '1' && runner.os == 'Windows'
        env:
          P12_BASE64: ${{ secrets.CODESIGN_WIN_CERT_P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/client.p12"
          echo "SM_CLIENT_CERT_FILE=$(cygpath -w "$RUNNER_TEMP/client.p12")" >> "$GITHUB_ENV"
      # Without an input the action only installs smctl; build.py, standalone_cli.py and package.py sign the app and
      # its helper programs, the command-line edi.exe, the maintenance tool and the installers with it (edi ADR-0091).
      - name: Install the KeyLocker signing tool
        if: github.event.pull_request.head.repo.fork == false && env.EDI_CODESIGN == '1' && runner.os == 'Windows'
        uses: digicert/code-signing-software-trust-action@v1
        with:
          simple-signing-mode: true
      - name: Build desktop bundle and CLI with the qualified SDK
        if: github.event.pull_request.head.repo.fork == false
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/build.py" --crysta-source "${{ github.workspace }}/.crysta" --work "${{ github.workspace }}/build/installer" --collection "${{ github.workspace }}/.edi-data"
        env:
          # The Windows app's C++ under MSVC's /W4 as errors on a pull request (ADR-0093); the CI app jobs cover Linux and
          # macOS, and a release build is never stopped by a warning.
          EDI_WERROR: ${{ github.event_name == 'pull_request' && runner.os == 'Windows' && 'ON' || 'OFF' }}
          EDI_CODESIGN_MAC_IDENTITY: ${{ runner.os == 'macOS' && vars.CODESIGN_MAC_IDENTITY || '' }}
          EDI_NOTARY_APPLE_ID: ${{ env.EDI_CODESIGN == '1' && runner.os == 'macOS' && secrets.CODESIGN_MAC_NOTARY_APPLE_ID || '' }}
          EDI_NOTARY_PASSWORD: ${{ env.EDI_CODESIGN == '1' && runner.os == 'macOS' && secrets.CODESIGN_MAC_NOTARY_PASSWORD || '' }}
          EDI_NOTARY_TEAM_ID: ${{ runner.os == 'macOS' && vars.CODESIGN_MAC_TEAM_ID || '' }}
          SM_HOST: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && vars.CODESIGN_WIN_KEYLOCKER_HOST || '' }}
          SM_API_KEY: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && secrets.CODESIGN_WIN_KEYLOCKER_API_KEY || '' }}
          SM_CLIENT_CERT_PASSWORD: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && secrets.CODESIGN_WIN_CERT_P12_PASSWORD || '' }}
          EDI_CODESIGN_WIN_KEYPAIR_ALIAS: ${{ runner.os == 'Windows' && vars.CODESIGN_WIN_KEYLOCKER_KEYPAIR_ALIAS || '' }}
      - name: Save installer compiler objects
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        uses: ./.github/actions/store
        with:
          ccache: pixi run --manifest-path tools/installer/pixi.toml python
          path: ${{ runner.temp }}/edi-ccache
          key: ccache2-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/installer/pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compiler cache hits
        if: always()
        run: pixi run --manifest-path tools/installer/pixi.toml ccache --show-stats
      - name: Check assistant process-family shutdown on this platform
        run: |
          pixi run --manifest-path tools/installer/pixi.toml cmake --build build/installer/app --target edi_assistant_lifetime_host --parallel 4
          export EDI_LIFETIME_BIN_DIR="$(cat build/installer/app/edi-assistant-lifetime-directory.txt)"
          pixi run --manifest-path tools/installer/pixi.toml python -m pytest "${{ github.workspace }}/tests/fixtures/assistant_fixes/check_process_lifetime.py" --noconftest -o addopts= -q --junitxml=build/installer/assistant-lifetime.xml
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Check retired project ownership before packaging
        run: |
          pixi run --manifest-path tools/installer/pixi.toml cmake --build build/installer/app --target edi_trial_lock_tests --parallel 4
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import subprocess
          from pathlib import Path
          binary = Path(Path('build/installer/app/edi-trial-lock-executable.txt').read_text().strip())
          subprocess.run([str(binary.resolve()), '-o', 'build/installer/project-retirement.xml,junitxml'], check=True)
          PYTHON
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      # The installers ship this tool instead of writing one from their own binary, which a real signature
      # forbids. Release builds sign it (macOS: Developer ID, hardened runtime, notarised; Windows: KeyLocker);
      # otherwise macOS signs it ad hoc and Windows leaves it unsigned (edi ADR-0091).
      - name: Build and sign the maintenance tool
        if: github.event.pull_request.head.repo.fork == false && runner.os != 'Linux'
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" maintenance-tool --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/maintenance"
        env:
          EDI_CODESIGN_MAC_IDENTITY: ${{ env.EDI_CODESIGN == '1' && runner.os == 'macOS' && vars.CODESIGN_MAC_IDENTITY || '' }}
          EDI_NOTARY_APPLE_ID: ${{ env.EDI_CODESIGN == '1' && runner.os == 'macOS' && secrets.CODESIGN_MAC_NOTARY_APPLE_ID || '' }}
          EDI_NOTARY_PASSWORD: ${{ env.EDI_CODESIGN == '1' && runner.os == 'macOS' && secrets.CODESIGN_MAC_NOTARY_PASSWORD || '' }}
          EDI_NOTARY_TEAM_ID: ${{ env.EDI_CODESIGN == '1' && runner.os == 'macOS' && vars.CODESIGN_MAC_TEAM_ID || '' }}
          SM_HOST: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && vars.CODESIGN_WIN_KEYLOCKER_HOST || '' }}
          SM_API_KEY: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && secrets.CODESIGN_WIN_KEYLOCKER_API_KEY || '' }}
          SM_CLIENT_CERT_PASSWORD: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && secrets.CODESIGN_WIN_CERT_P12_PASSWORD || '' }}
          EDI_CODESIGN_WIN_KEYPAIR_ALIAS: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && vars.CODESIGN_WIN_KEYLOCKER_KEYPAIR_ALIAS || '' }}
      - name: Create the offline qualification installer
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" package --stage "${{ github.workspace }}/build/installer/stage" --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/package" ${{ runner.os != 'Linux' && format('--maintenance-tool "{0}/build/installer/maintenance/maintenance-tool/MaintenanceTool{1}"', github.workspace, runner.os == 'macOS' && '.app' || '.exe') || '' }}
      - name: Sign the offline installer and its download
        if: github.event.pull_request.head.repo.fork == false && env.EDI_CODESIGN == '1' && runner.os != 'Linux'
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" seal --output "${{ github.workspace }}/build/installer/package"
        env:
          EDI_CODESIGN_MAC_IDENTITY: ${{ runner.os == 'macOS' && vars.CODESIGN_MAC_IDENTITY || '' }}
          EDI_NOTARY_APPLE_ID: ${{ runner.os == 'macOS' && secrets.CODESIGN_MAC_NOTARY_APPLE_ID || '' }}
          EDI_NOTARY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CODESIGN_MAC_NOTARY_PASSWORD || '' }}
          EDI_NOTARY_TEAM_ID: ${{ runner.os == 'macOS' && vars.CODESIGN_MAC_TEAM_ID || '' }}
          SM_HOST: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && vars.CODESIGN_WIN_KEYLOCKER_HOST || '' }}
          SM_API_KEY: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && secrets.CODESIGN_WIN_KEYLOCKER_API_KEY || '' }}
          SM_CLIENT_CERT_PASSWORD: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && secrets.CODESIGN_WIN_CERT_P12_PASSWORD || '' }}
          EDI_CODESIGN_WIN_KEYPAIR_ALIAS: ${{ runner.os == 'Windows' && vars.CODESIGN_WIN_KEYLOCKER_KEYPAIR_ALIAS || '' }}
      - name: Install, launch, calculate, render and uninstall
        run: |
          installer=$(cat build/installer/package/installer.json | sed -n 's/.*"download": "\([^"]*\)".*/\1/p')
          pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" test --installer "${{ github.workspace }}/build/installer/package/$installer" --output "${{ github.workspace }}/build/installer/test"
      - name: Create the online distribution installer
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" package --kind online --stage "${{ github.workspace }}/build/installer/stage" --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/online" ${{ runner.os != 'Linux' && format('--maintenance-tool "{0}/build/installer/maintenance/maintenance-tool/MaintenanceTool{1}"', github.workspace, runner.os == 'macOS' && '.app' || '.exe') || '' }}
      - name: Sign the online installer and its download
        if: github.event.pull_request.head.repo.fork == false && env.EDI_CODESIGN == '1' && runner.os != 'Linux'
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" seal --output "${{ github.workspace }}/build/installer/online"
        env:
          EDI_CODESIGN_MAC_IDENTITY: ${{ runner.os == 'macOS' && vars.CODESIGN_MAC_IDENTITY || '' }}
          EDI_NOTARY_APPLE_ID: ${{ runner.os == 'macOS' && secrets.CODESIGN_MAC_NOTARY_APPLE_ID || '' }}
          EDI_NOTARY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CODESIGN_MAC_NOTARY_PASSWORD || '' }}
          EDI_NOTARY_TEAM_ID: ${{ runner.os == 'macOS' && vars.CODESIGN_MAC_TEAM_ID || '' }}
          SM_HOST: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && vars.CODESIGN_WIN_KEYLOCKER_HOST || '' }}
          SM_API_KEY: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && secrets.CODESIGN_WIN_KEYLOCKER_API_KEY || '' }}
          SM_CLIENT_CERT_PASSWORD: ${{ env.EDI_CODESIGN == '1' && runner.os == 'Windows' && secrets.CODESIGN_WIN_CERT_P12_PASSWORD || '' }}
          EDI_CODESIGN_WIN_KEYPAIR_ALIAS: ${{ runner.os == 'Windows' && vars.CODESIGN_WIN_KEYLOCKER_KEYPAIR_ALIAS || '' }}
      - name: Qualify the online installer with local component transport
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          root = Path.cwd()
          package = root / 'build/installer/online'
          metadata = json.loads((package / 'installer.json').read_text())
          subprocess.run([
              'python', str(root / 'tools/installer/package.py'), 'test',
              '--installer', str(package / metadata['download']),
              '--repository', (package / 'repository').as_uri() + '/',
              '--output', str(root / 'build/installer/online-test'),
          ], check=True)
          subprocess.run([
              'python', str(root / 'tools/installer/package.py'), 'test',
              '--installer', str(package / metadata['download']),
              '--repository', (package / 'repository').as_uri() + '/',
              '--output', str(root / 'build/installer/online-assistant-test'),
              '--with-assistant',
          ], check=True)
          PYTHON
      - name: Prepare the tested platform repository
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import json, shutil
          from pathlib import Path
          package = Path('build/installer/online')
          metadata = json.loads((package / 'installer.json').read_text())
          import os
          channel = 'stable' if os.environ.get('EDI_RELEASE_PLAN') else 'testing'
          target = Path('build/installer/components') / channel / metadata['platform']
          shutil.copytree(package / 'repository', target)
          delivery = Path('build/installer/delivery')
          delivery.mkdir()
          # The tested repository goes onto the release too, as one archive with its relative paths.
          import sys
          sys.path.insert(0, 'tools/release')
          from promote import components_name, pack_components
          pack_components(target, delivery / components_name(metadata['version'], metadata['platform'], channel))
          os.link(package / metadata['download'], delivery / metadata['download'])
          shutil.copy2(package / 'installer.json', delivery / 'installer.json')
          shutil.copy2('build/installer/stage/build-inputs.json', delivery / 'build-inputs.json')
          shutil.copy2('build/installer/online-test/passed.json', delivery / 'qualification.json')
          # The tested offline installer goes onto the release beside the online one.
          offline = Path('build/installer/package')
          offline_metadata = json.loads((offline / 'installer.json').read_text())
          shutil.copy2(offline / 'installer.json', delivery / 'offline-installer.json')
          shutil.copy2('build/installer/test/passed.json', delivery / 'offline-qualification.json')
          os.link(offline / offline_metadata['download'], delivery / offline_metadata['download'])
          cli_receipt = Path('build/installer/cli-qualification.json')
          if cli_receipt.is_file():
              cli = json.loads(cli_receipt.read_text())
              shutil.copy2(cli_receipt, delivery / cli_receipt.name)
              os.link(cli_receipt.parent / cli['zip'], delivery / cli['zip'])
          wheel_receipt = Path('build/installer/wheel-qualification.json')
          if wheel_receipt.is_file():
              wheel = json.loads(wheel_receipt.read_text())
              shutil.copy2(wheel_receipt, delivery / wheel_receipt.name)
              os.link(wheel_receipt.parent / wheel['wheel'], delivery / wheel['wheel'])
          preview_history = Path('build/installer/preview-history.json')
          if preview_history.is_file():
              shutil.copy2(preview_history, delivery / 'preview-history.json')
          PYTHON
      # Every store and publisher reads installers itself; only macOS opens its disk images.
      - name: Check what the disk images hold
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python tools/installer/packed_source.py \
            --receipt build/installer/source-check/receipt.json build/installer/delivery build/installer/components
      - name: Keep the receipt of that check
        uses: ./.github/actions/store
        with:
          artifact: installer-source-check-${{ runner.os }}-${{ github.run_attempt }}
          path: build/installer/source-check/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload qualified release files
        uses: ./.github/actions/store
        with:
          artifact: installer-${{ runner.os }}-${{ github.run_attempt }}
          path: build/installer/delivery
          receipt: build/installer/source-check/receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30  # the release publication takes the qualified files
      - name: Upload tested components
        uses: ./.github/actions/store
        with:
          artifact: installer-components-${{ runner.os }}-${{ github.run_attempt }}
          path: build/installer/components
          receipt: build/installer/source-check/receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30  # the release publication takes the tested components
      - name: Remove the KeyLocker client certificate
        if: always() && runner.os == 'Windows'
        run: rm -f "$RUNNER_TEMP/client.p12"
      - name: Upload installation diagnostics
        if: always()
        uses: ./.github/actions/store
        with:
          withhold: 'true'
          artifact: installer-check-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            build/installer/assistant-lifetime.xml
            build/installer/project-retirement.xml
            build/installer/test/*.log
            build/installer/test/*.json
            build/installer/test/smoke/**
            build/installer/online-test/*.log
            build/installer/online-test/*.json
            build/installer/online-test/smoke/**
            build/installer/online-assistant-test/*.log
            build/installer/online-assistant-test/*.json
            build/installer/online-assistant-test/smoke/**
            build/installer/online/installer.json
            build/installer/stage/bundle-audit.json
            build/installer/protocol/*.log
            build/installer/protocol/passed.json
            build/installer/package/installer.json
          if-no-files-found: ignore
          retention-days: 7  # a failed installation is inspected within days

  # Every page of the installer and its maintenance tool, light and dark, from a small marker installer (no app
  # build): Linux under a virtual display with the theme forced, Windows and macOS with the system's own appearance set.
  # The pictures are a run artifact for a person to look at; nothing is committed and nothing else runs.
  installer-pages:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_pages
    name: installer pages · ${{ matrix.runner == 'windows-2025' && 'Windows' || matrix.runner == 'macos-15' && 'macOS' || 'Linux' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Windows Server 2025 has Windows 11's dark app mode, which the installer follows; 2022 has none.
        runner: [ubuntu-24.04, windows-2025, macos-15]
        exclude:
          - runner: ${{ inputs.capture_linux_only && 'windows-2025' || 'none' }}
          - runner: ${{ inputs.capture_linux_only && 'macos-15' || 'none' }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - name: Set up the locked packaging environment
        uses: ./.github/actions/setup-pixi
        with:
          manifest-path: tools/installer/pixi.toml
      - name: Acquire the pinned Qt Installer Framework
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" tools --output "${{ github.workspace }}/build/installer/ifw"
      - name: A virtual display, a window manager and a screen grabber on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb openbox imagemagick
      - name: Capture every page, light and dark
        shell: bash
        run: |
          capture=(pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/capture_pages.py" --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/pages")
          # On Linux a window manager draws the window's frame and title, as on a desktop.
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s "-screen 0 1280x900x24" bash -c 'openbox & sleep 2; exec "$@"' capture "${capture[@]}"
          else
            "${capture[@]}"
          fi
      - name: Keep the page captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-pages-${{ runner.os }}
          path: |
            build/installer/pages/pages
            build/installer/pages/*.log
          if-no-files-found: warn

          retention-days: 7  # page captures inspected within days
  qualify-release:
    name: record qualified release inputs
    needs: installers
    if: >-
      !cancelled() && needs.installers.result == 'success' && inputs.release_plan_run != ''
      && !inputs.windows_only && !inputs.prepare_preview_release && inputs.preview_run == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Recover the exact prepared inputs
        run: python tools/release/download_plan.py --repo "$GITHUB_REPOSITORY" --run "$PREPARE_RUN" --output release-plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN: ${{ inputs.release_plan_run }}
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-release-plan-${{ github.run_attempt }}
          path: release-plan
          if-no-files-found: error
          retention-days: 90

  draft-preview-release:
    name: Create or update the prerelease draft
    needs: installers
    if: >-
      github.event.pull_request.head.repo.fork == false && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.prepare_preview_release
      && (needs.installers.result == 'success' || (inputs.preview_run != '' && needs.installers.result == 'skipped'))
    environment: crysta-sdk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: inputs.preview_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: installer-{Linux,macOS,Windows}-*
          path: preview-delivery
      - name: Recover qualified installers from the preview run
        if: inputs.preview_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
        shell: bash
        run: |
          python3 tools/release/preview.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" \
            --run "$PREVIEW_RUN" --output preview-delivery --deliveries
      - name: The pinned crysta commit
        id: crysta
        shell: bash
        run: bash tools/ci/crysta-source.sh
      - name: The receipts of the installers' checked content
        uses: actions/download-artifact@v4
        with:
          pattern: installer-source-check-*
          path: source-checks
          run-id: ${{ inputs.preview_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: crysta's source, whose lines no later step prints or stores
        uses: ./.github/actions/crysta-source
        with:
          sha: ${{ steps.crysta.outputs.sha }}
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.CRYSTA_READ_KEY }}
          history: 'true'
          receipts: source-checks
      - name: Check every file that is published
        run: python3 tools/ci/stored_source.py --receipt source-checks preview-delivery
      - name: Attach qualified online installers to the draft
        if: github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ secrets.GH_API_PERSONAL_ACCESS_TOKEN }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Draft creation needs the release token with permission to modify workflows."
            exit 1
          fi
          # A retry of this job can reuse the last complete set from this run.
          selected=0
          for linux in preview-delivery/installer-Linux-*; do
            attempt=${linux##*-}
            if [[ "$attempt" =~ ^[1-9][0-9]*$ && -d "preview-delivery/installer-macOS-$attempt" &&
                  -d "preview-delivery/installer-Windows-$attempt" ]] && (( attempt > selected )); then
              selected=$attempt
            fi
          done
          if (( selected == 0 )); then
            echo "No complete set of qualified installers is available."
            exit 1
          fi
          # Reused installers were built from the preview run's source, not this run's.
          commit=$GITHUB_SHA
          if [[ -n "$PREVIEW_RUN" ]]; then
            commit=$(cat preview-delivery/commit)
          fi
          python3 tools/release/preview_draft.py --repo "$GITHUB_REPOSITORY" \
            --commit "$commit" preview-delivery/installer-{Linux,macOS,Windows}-"$selected"

  # A failed or cancelled preview release deletes the draft it reserved, so no draft is left holding a version that
  # is never published (edi ADR-0071).
  remove-failed-preview-draft:
    name: Remove the draft of a failed preview release
    needs: [preview-version, installers, draft-preview-release]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.prepare_preview_release && inputs.preview_run == ''
      && needs.preview-version.result == 'success'
      && (needs.installers.result != 'success' || needs.draft-preview-release.result != 'success')
    environment: crysta-sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Delete this source's preview draft
        env:
          GH_TOKEN: ${{ secrets.GH_API_PERSONAL_ACCESS_TOKEN }}
        run: python tools/release/prepare.py --repo "$GITHUB_REPOSITORY" --withdraw preview

  publish-installers:
    name: Deploy testing installer components
    needs: installers
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.windows_only
      && inputs.publish_components && inputs.release_plan_run == '' && !github.event.repository.private
      && github.ref == 'refs/heads/main'
      && (needs.installers.result == 'success' || (inputs.preview_run != '' && needs.installers.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    # The public site's queue and reviewed environment, shared with pages.yml's publishers: the testing repositories
    # join the site behind easydiffraction.org (edi-sites' deploy-docs). GitHub Pages is the developers' test site,
    # deployed from edi's dev branch (the owner, 2026-11-17). Main only, the branch that environment admits.
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    environment: public-site
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download tested platform repositories
        if: inputs.preview_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: installer-components-*-${{ github.run_attempt }}
          merge-multiple: true
          path: components
      - name: Recover qualified preview repositories
        if: inputs.preview_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
        shell: bash
        run: |
          python3 tools/release/preview.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" \
            --run "$PREVIEW_RUN" --output preview
          mv preview/components components
      - name: Require the selected platforms from this successful attempt
        if: inputs.preview_run == ''
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path('components/testing')
          expected = {'linux-x86_64', 'macos-arm64', 'windows-x86_64'}
          if not root.is_dir() or {item.name for item in root.iterdir()} != expected:
              raise RuntimeError('Publish requires all platforms from one complete successful attempt; rerun all jobs')
          for platform in expected:
              if not (root / platform / 'Updates.xml').is_file():
                  raise RuntimeError('Platform repository metadata is missing')
          PYTHON
      - name: Download installed calendar preview identities
        if: inputs.prepare_preview_release && inputs.preview_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: installer-{Linux,macOS,Windows}-${{ github.run_attempt }}
          path: preview-delivery
      - name: Prepare the testing update feed
        if: inputs.prepare_preview_release && inputs.preview_run == ''
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('components/testing')
          histories = sorted(Path('preview-delivery').glob('installer-*/preview-history.json'))
          if len(histories) != 3 or any(path.read_bytes() != histories[0].read_bytes() for path in histories[1:]):
              raise RuntimeError('Preview release histories differ')
          payload = histories[0].read_bytes()
          version = json.loads(payload)['releases'][0]['version']
          for metadata in root.glob('*/Updates.xml'):
              versions = {item.findtext('Version') for item in ET.parse(metadata).findall('PackageUpdate')}
              if versions != {version}:
                  raise RuntimeError('Testing repositories do not match the preview feed')
          (root / 'feed.json').write_bytes(payload)
          PYTHON
      - name: Mint a token for edi-sites
        id: sites-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.CRYSTA_READ_KEY }}
          owner: enhantica
          repositories: edi-sites
      - name: Preserve documentation, web app and previous components
        env:
          SITES_TOKEN: ${{ steps.sites-token.outputs.token }}
        shell: bash
        run: |
          bash tools/ci/fetch_deploy_branch.sh deploy-docs "$RUNNER_TEMP/deployed"
          python3 tools/ci/pages_update.py --repo "$GITHUB_REPOSITORY" --component installers --incoming components --site site --base "$RUNNER_TEMP/deployed"
      - name: The pinned crysta commit
        id: crysta
        shell: bash
        run: bash tools/ci/crysta-source.sh
      - name: The receipts of the installers' checked content
        uses: actions/download-artifact@v4
        with:
          pattern: installer-source-check-*
          path: source-checks
          run-id: ${{ inputs.preview_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: crysta's source, whose lines no later step prints or stores
        uses: ./.github/actions/crysta-source
        with:
          sha: ${{ steps.crysta.outputs.sha }}
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.CRYSTA_READ_KEY }}
          history: 'true'
          site: site
          receipts: source-checks
      - name: Check every file that is published
        run: python3 tools/ci/stored_source.py --receipt source-checks site
      - name: Update the deploy-docs branch
        env:
          SITES_TOKEN: ${{ steps.sites-token.outputs.token }}
        run: bash tools/ci/push_deploy_branch.sh site deploy-docs
