# edi's CI for a public repository, on GitHub-hosted runners. The runner of each platform is named
# once, as a YAML anchor: `&linux` on the `changes` job and `&macos` in the native job's matrix.
#
# A job that builds against crysta needs a read token for crysta's prebuilt SDK, so it runs only for
# events from this repository (never a fork's pull request) and in the reviewed `crysta-sdk`
# environment, which holds the app key. A fork's pull request runs the jobs that need no token, and
# the pin-currency job without its token steps.
# Compatible native consumers share this run's validated Edi artifacts and qualified SDK.
# Qt and browser configurations keep their own builds; compiler caches cover both.
name: Tests

on:
  push:
    branches: [main]
  # Every night the declared group runs on main on both platforms, with the nightly-only group's files that
  # pull requests and main pushes leave out (tests/test-groups.json). The Sunday run also takes the
  # weekly-only group, the CIF import matrix, which alone adds about two hours to the core job.
  schedule:
    - cron: '45 1 * * *'
    - cron: '15 2 * * 0'
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      # A repair round's fast signal: changes, pin currency, native and core (and the dispatch-only
      # cli-native placeholder). It skips required jobs, so its head is not merge evidence.
      core_only:
        description: Run only the native builds and the core test jobs (not evidence)
        type: boolean
        default: false

# The schedule is part of the key, so a nightly run and a main push never cancel each other.
# A main push shares one group with the installers' release builds, so the two queue rather than compete for
# runners; neither cancels the other.
concurrency:
  group: ${{ github.event_name == 'push' && 'edi-main-push-and-release' || format('{0}-{1}-{2}', github.workflow, github.event.pull_request.number || github.ref, github.event.schedule) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
  # Main pushes and release builds keep every waiting run (a single pending slot would drop one); PRs and nights keep
  # only the newest, which GitHub allows only with `single`.
  queue: ${{ github.event_name == 'push' && 'max' || 'single' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: &linux ubuntu-24.04
    outputs:
      app_build: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.app_build == 'true' }}
      crysta_sha: ${{ steps.crysta-source.outputs.sha }}
      wasm_build: ${{ steps.filter.outputs.wasm_build == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Read the crysta pin
        id: crysta-source
        run: pixi run bash tools/ci/crysta-source.sh
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app_build: ['tools/ci/app-build.sh']
            # Qualify app, browser transport and publication infrastructure changes.
            wasm_build: ['app/**', 'tools/ci/wasm*', '.github/workflows/ci.yml', '.github/workflows/pages.yml', '.github/actions/wasm-cache/**', 'tests/system/manual/*.mjs', 'tests/fixtures/e04_t11_wasm/**', 'tests/fixtures/survey/**', 'tests/system/py/test_survey_events.py', 'tests/integration/py/test_preferences_and_survey.py', 'website/surfaces/docs/assets/survey/**', 'website/surfaces/docs/about/survey.md', 'website/surfaces/mkdocs.yml', 'website/build.py', 'pixi.toml', 'pixi.lock', 'tools/ci/crysta*', 'tools/ci/compiler_cache.py']

  # The crysta SDK this run builds against, once per crysta commit (edi ADR-0083).
  crysta-sdk:
    if: github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/crysta-sdk.yml
    secrets: inherit

  lint:
    name: lint
    if: inputs.core_only != true
    runs-on: *linux
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      # Every check runs and reports even when an earlier one fails (owner, 2026-11-15); the step still fails.
      # The same checks as `pixi run lint` and the pre-push hook (tools/ci/lint.sh).
      - name: Ruff lint + format, entity-path convention
        run: bash tools/ci/lint.sh style
      - name: Static policy checks (weakref, tutorial exclusions, generated regions)
        if: ${{ !cancelled() }}
        run: bash tools/ci/lint.sh policy

  native:
    name: native · ${{ matrix.platform }}
    if: github.event.pull_request.head.repo.fork == false
    environment: crysta-sdk
    needs: [changes, crysta-sdk]
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
            sdk: linux-64
          - platform: macOS
            runner: &macos macos-15
            sdk: osx-arm64
          - platform: Windows
            runner: windows-2022
            sdk: win-64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    steps:
      - &windows-git
        name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true
      - &native-checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - &windows-compiler
        name: Set up the Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'
      - uses: ./.github/actions/setup-pixi
      # The compiler cache (core), between runs: this job keeps it for the next run.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          max-size: 400M
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/edi-ccache
          key: ccache2-core-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-core-${{ steps.ccache.outputs.key-prefix }}
            ccache2-core-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ matrix.sdk }}
      - &crysta-source
        name: crysta's source, whose lines no later step prints or stores
        uses: ./.github/actions/crysta-source
        with:
          sha: ${{ env.CRYSTA_SOURCE_SHA }}
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
      - name: Build the native code once (core-build, then edi_tests in the same tree)
        id: build
        run: pixi run core-build
        env:
          EDI_CORE_TARGETS: edi_tests edi_integration_tests
      - name: Pack the validated native build
        run: pixi run python tools/ci/edi_native.py pack --out build/edi-native-artifact
      - uses: ./.github/actions/store
        with:
          artifact: edi-native-${{ matrix.sdk }}
          path: build/edi-native-artifact
          retention-days: 7
          if-no-files-found: error
      # The tests need only the build, so each runs even when the step before it failed.
      - name: C++ unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pixi run --skip-deps cpp-test
      - name: Standalone and Python fit output agree
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pixi run --skip-deps cli-stream-parity
      - name: Save the native compiler cache after the attempt
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: ./.github/actions/store
        with:
          ccache: pixi run --skip-deps python
          path: ~/.cache/edi-ccache
          key: ccache2-core-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}


  audit:
    name: audit
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.event.pull_request.head.repo.fork == false && inputs.core_only != true }}
    environment: crysta-sdk
    # After the core tests, which take the runners first. It runs even when core fails, so one round lists
    # every failure.
    needs: [changes, core, crysta-sdk]
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    runs-on: *linux
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pixi
      # The compiler cache (core), between runs: the native job keeps it; this job only reads it.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          max-size: 400M
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/edi-ccache
          key: ccache2-core-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-core-${{ steps.ccache.outputs.key-prefix }}
            ccache2-core-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - uses: ./.github/actions/edi-native
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - *crysta-source
      - name: Build the native code
        run: pixi run core-build
      - name: Runtime-manifest equality audit
        run: pixi run per-pr-audit

  core:
    name: core · ${{ matrix.platform }}
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.crysta-sdk.result == 'success' && github.event.pull_request.head.repo.fork == false }}
    environment: crysta-sdk
    needs: [changes, native, crysta-sdk]
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
      # edi's own C++ builds without a warning (ADR-0093), MSVC's /W4 set included.
      EDI_WERROR: 'ON'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
            sdk: linux-64
          - platform: macOS
            runner: *macos
            sdk: osx-arm64
          - platform: Windows
            runner: windows-2022
            sdk: win-64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    steps:
      - *windows-git
      - *native-checkout
      - *windows-compiler
      - uses: ./.github/actions/setup-pixi
      - name: Keep the selected Bash available to test subprocesses
        shell: bash
        run: python tools/ci/native_shell.py "$BASH"
      # The compiler cache (core), between runs: the native job keeps it; this job only reads it.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          max-size: 400M
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/edi-ccache
          key: ccache2-core-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-core-${{ steps.ccache.outputs.key-prefix }}
            ccache2-core-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ matrix.sdk }}
      - uses: ./.github/actions/edi-native
        with:
          platform: ${{ matrix.sdk }}
      - *crysta-source
      - name: Build the native code
        id: build
        run: pixi run core-build
      # Each check and test tier below needs only the build, so it runs and reports even when an earlier one failed.
      - name: The crysta consumer proof
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pixi run crysta-consumer
      - name: Python surface, CLI vocabulary and label registry checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          pixi run --skip-deps python-surface-superset || status=1
          pixi run --skip-deps python-surface-check || status=1
          pixi run --skip-deps cli-vocabulary-check || status=1
          pixi run --skip-deps display-sources-check || status=1
          pixi run --skip-deps label-registry-check || status=1
          exit $status
      # The declared group runs as parallel jobs (owner, 2026-10-08): the C++ unit tests, unit and
      # integration here, and the system tier in the three `system` jobs below, which pull requests skip.
      - name: Tests (declared group, C++ unit, unit and integration)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          pixi run cpp-test || status=1
          pixi run core-tests || status=1
          exit $status
        env:
          # Name every test over a second, so a slow one shows in the log.
          PYTEST_ADDOPTS: --durations=0 --durations-min=1
          EDI_RUN_NIGHTLY_ONLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.core_only != true) }}
          EDI_RUN_WEEKLY_ONLY: ${{ github.event.schedule == '15 2 * * 0' }}
      # It takes about 8 minutes, so it runs on main pushes, the nightly and manual runs, not on pull requests.
      - name: The two-thread witness (ThreadSanitizer)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.platform == 'Linux' && github.event_name != 'pull_request' }}
        # A hang must fail the step instead of holding the run.
        timeout-minutes: 20
        run: pixi run --skip-deps tsan-worker

  # The declared group's system tier, split into three parts by pytest-split on recorded test times
  # (tools/ci/system-tests-part.sh). A test with no recorded time counts as the average. Each part
  # keeps its durations as an artifact, and on main the `system durations` job merges them for the
  # next run's split.
  system:
    name: system · ${{ matrix.platform }} · ${{ matrix.part }}/3
    # The system tier takes 15 to 25 minutes a part, so only the nightly and manual runs take it.
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.event.pull_request.head.repo.fork == false && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    environment: crysta-sdk
    # The tests that drive the app run the app and its test runner the app job built (edi-app-<platform>), so no
    # system job compiles them.
    needs: [changes, app, app-macos, crysta-sdk]
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            part: 1
            runner: *linux
            sdk: linux-64
          - platform: Linux
            part: 2
            runner: *linux
            sdk: linux-64
          - platform: Linux
            part: 3
            runner: *linux
            sdk: linux-64
          - platform: macOS
            part: 1
            runner: *macos
            sdk: osx-arm64
          - platform: macOS
            part: 2
            runner: *macos
            sdk: osx-arm64
          - platform: macOS
            part: 3
            runner: *macos
            sdk: osx-arm64
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pixi
      # The compiler cache (core), between runs: the native job keeps it; this job only reads it.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          max-size: 400M
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/edi-ccache
          key: ccache2-core-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-core-${{ steps.ccache.outputs.key-prefix }}
            ccache2-core-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - uses: ./.github/actions/edi-native
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - *crysta-source
      - name: Build the native code
        run: pixi run core-build
      # Each platform's app job keeps its app as soon as it is built. Whenever that job ran, each part restores its
      # own platform's app, and a part whose app was never built fails here.
      - name: Fetch the app and its test runner the app job built
        if: (matrix.platform == 'Linux' && needs.app.result || needs.app-macos.result) != 'skipped'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/app/app/edi_app
            build/app/app/edi_app_tests
            build/app/app/edi_assistant_guard
          key: edi-app-${{ matrix.platform }}-${{ github.run_id }}
          fail-on-cache-miss: true
      # Without it the tests that need it say so themselves.
      - name: Fetch the tutorial transaction observer the app job built
        if: (matrix.platform == 'Linux' && needs.app.result || needs.app-macos.result) != 'skipped'
        uses: actions/cache/restore@v4
        with:
          path: build/tutorial-transactions
          key: edi-observer-${{ matrix.platform }}-${{ github.run_id }}
      - name: Make them executable
        if: (matrix.platform == 'Linux' && needs.app.result || needs.app-macos.result) != 'skipped'
        run: chmod +x build/app/app/edi_app build/app/app/edi_app_tests build/app/app/edi_assistant_guard
      # The app loads Qt and its other libraries from the app environment, which this job does not
      # otherwise install.
      - name: Install the app's environment
        if: (matrix.platform == 'Linux' && needs.app.result || needs.app-macos.result) != 'skipped'
        run: pixi install -e app
      - name: Restore the recorded test durations
        uses: actions/cache/restore@v4
        with:
          path: build/test-durations.json
          key: test-durations-${{ runner.os }}-${{ github.run_id }}
          restore-keys: test-durations-${{ runner.os }}-
      - name: Tests (declared group, system part)
        run: pixi run system-tests-part ${{ matrix.part }} 3
        env:
          # Name every test over a second, so a slow one shows in the log.
          PYTEST_ADDOPTS: --durations=0 --durations-min=1
          # The nightly-only group's files (tests/test-groups.json) run on the nightly schedule and on a full manual
          # run, so a branch can show the nightly before it merges.
          EDI_RUN_NIGHTLY_ONLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.core_only != true) }}
      - name: Seeded series (slow cadence)
        if: ${{ !cancelled() && matrix.part == 1 && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.core_only != true)) }}
        run: pixi run slow-seeded-series
      - name: Keep the nightly project-opening frame report
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: ./.github/actions/store
        with:
          artifact: project-opening-${{ matrix.platform }}-${{ matrix.part }}
          withhold: 'true'
          path: build/project-opening/*.json
          if-no-files-found: ignore
      - name: Keep the part's durations
        if: ${{ !cancelled() }}
        uses: ./.github/actions/store
        with:
          artifact: system-${{ matrix.platform }}-${{ matrix.part }}
          withhold: 'true'
          path: build/test-durations-${{ matrix.part }}.json
          if-no-files-found: warn

          retention-days: 7  # durations read from recent runs
  # At night, each system shard may take at most 1.2 times as long as the same shard in the newest earlier nightly
  # run with the same shards, all passed. The first night with no such run records "no baseline" and judges nothing.
  # Advisory: a slow night is reported, never blocking.
  system-time:
    name: system time
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.system.result == 'success' }}
    needs: [changes, system]
    runs-on: *linux
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - run: mkdir -p "$RUNNER_TEMP/system-time"
      - name: Fetch this run's and the last nightly's job records
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pixi run python tools/ci/system_shard_time.py --nightly --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --head-sha '${{ github.sha }}' --save "$RUNNER_TEMP/system-time/history.json"
          --fetch-only
      - name: Compare the system shards with the last nightly
        run: >-
          pixi run python tools/ci/system_shard_time.py --nightly --history "$RUNNER_TEMP/system-time/history.json"
          --run-id "$GITHUB_RUN_ID" --head-sha '${{ github.sha }}' --record "$RUNNER_TEMP/system-time/record.json"
      - name: Keep the comparison record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: system-time
          path: ${{ runner.temp }}/system-time/
          if-no-files-found: ignore
          retention-days: 30

  # At night, the three parts' durations become the recorded times the next runs split by.
  system-durations:
    name: system durations · ${{ matrix.platform }}
    if: github.event_name == 'schedule'
    needs: system
    strategy:
      matrix:
        include:
          - platform: Linux
            runner: *linux
          - platform: macOS
            runner: *macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore the recorded test durations
        uses: actions/cache/restore@v4
        with:
          path: build/test-durations.json
          key: test-durations-${{ runner.os }}-${{ github.run_id }}
          restore-keys: test-durations-${{ runner.os }}-
      - uses: actions/download-artifact@v6
        with:
          pattern: system-${{ matrix.platform }}-*
          path: build/parts
          merge-multiple: true
      - name: Merge the parts' durations
        run: |
          python3 tools/ci/merge_test_durations.py --recorded build/test-durations.json \
            --out build/merged/test-durations.json build/parts/test-durations-*.json
          mv build/merged/test-durations.json build/test-durations.json
      - name: Record the durations for the next runs
        uses: actions/cache/save@v4
        with:
          path: build/test-durations.json
          key: test-durations-${{ runner.os }}-${{ github.run_id }}

  notebooks:
    name: notebooks
    # Runs for every result-changing surface. It runs even when native or core fails, so one round lists
    # every failure; a fork's pull request skips it, as it skips the native job.
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.event.pull_request.head.repo.fork == false && inputs.core_only != true }}
    environment: crysta-sdk
    # After the native build and the core tests of this run, which take the runners first. Each job still
    # validates and restores this run's default native build before notebook execution.
    needs: [changes, native, core, crysta-sdk]
    env:
      # Pull requests and main pushes run only the marker step below; the nightly and manual runs do the work.
      NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    runs-on: *linux
    steps:
      - name: Notebooks run at night and on a manual run
        if: env.NIGHTLY != 'true'
        shell: bash
        run: echo "Notebooks run at night and on a manual run; this $GITHUB_EVENT_NAME run does not."
      - uses: actions/checkout@v5
        if: env.NIGHTLY == 'true'
      - uses: ./.github/actions/setup-pixi
        if: env.NIGHTLY == 'true'
      # The compiler cache (core), between runs: the native job keeps it; this job only reads it.
      - id: ccache
        if: env.NIGHTLY == 'true'
        uses: ./.github/actions/ccache
        with:
          max-size: 400M
      - uses: actions/cache/restore@v4
        if: env.NIGHTLY == 'true'
        with:
          path: ~/.cache/edi-ccache
          key: ccache2-core-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-core-${{ steps.ccache.outputs.key-prefix }}
            ccache2-core-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/crysta-sdk
        if: env.NIGHTLY == 'true'
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - uses: ./.github/actions/edi-native
        if: env.NIGHTLY == 'true'
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - name: crysta's source, whose lines no later step prints or stores
        if: env.NIGHTLY == 'true'
        uses: ./.github/actions/crysta-source
        with:
          sha: ${{ env.CRYSTA_SOURCE_SHA }}
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
      - name: Build the native code
        if: ${{ env.NIGHTLY == 'true' && (github.event.pull_request.head.repo.fork == false) }}
        run: pixi run core-build
      - name: Execute the verification notebooks
        if: ${{ env.NIGHTLY == 'true' && (github.event.pull_request.head.repo.fork == false) }}
        run: pixi run notebook-tests
        env:
          # Name every test over a second, so a slow one shows in the log.
          PYTEST_ADDOPTS: --durations=0 --durations-min=1

  cli-python:
    name: cli-python · ${{ matrix.platform }}
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.event.pull_request.head.repo.fork == false && inputs.core_only != true }}
    environment: crysta-sdk
    # After the core tests, which take the runners first. It runs even when core fails, so one round lists
    # every failure.
    needs: [changes, core, crysta-sdk]
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
            sdk: linux-64
          - platform: macOS
            runner: *macos
            sdk: osx-arm64
          - platform: Windows
            runner: windows-2022
            sdk: win-64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    steps:
      - *windows-git
      - *native-checkout
      - *windows-compiler
      - uses: ./.github/actions/setup-pixi
      # The compiler cache (core), between runs: the native job keeps it; this job only reads it.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          max-size: 400M
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/edi-ccache
          key: ccache2-core-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-core-${{ steps.ccache.outputs.key-prefix }}
            ccache2-core-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ matrix.sdk }}
      - uses: ./.github/actions/edi-native
        with:
          platform: ${{ matrix.sdk }}
      - *crysta-source
      - name: Build the native code
        run: pixi run core-build
      - name: Execute the CLI projects through python -m edi fit
        run: pixi run cli-projects

  cli-native:
    name: cli-native · ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch'
    needs: changes
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
          - platform: macOS
            runner: *macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Native CLI placeholder
        run: echo "Placeholder - the native easydiffraction CLI route is not yet exercised; the CLI projects run only through python -m edi fit (cli-python)."

  docs:
    name: docs
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.event.pull_request.head.repo.fork == false && inputs.core_only != true }}
    environment: crysta-sdk
    # After the core tests, which take the runners first. It runs even when core fails, so one round lists
    # every failure.
    needs: [changes, core, crysta-sdk]
    env:
      # Pull requests and main pushes run only the marker step below; the nightly and manual runs do the work.
      NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    runs-on: *linux
    steps:
      - name: The docs build runs at night and on a manual run
        if: env.NIGHTLY != 'true'
        shell: bash
        run: echo "The docs build runs at night and on a manual run; this $GITHUB_EVENT_NAME run does not."
      - uses: actions/checkout@v5
        if: env.NIGHTLY == 'true'
      - uses: ./.github/actions/setup-pixi
        if: env.NIGHTLY == 'true'
      # The compiler cache (core), between runs: the native job keeps it; this job only reads it.
      - id: ccache
        if: env.NIGHTLY == 'true'
        uses: ./.github/actions/ccache
        with:
          max-size: 400M
      - uses: actions/cache/restore@v4
        if: env.NIGHTLY == 'true'
        with:
          path: ~/.cache/edi-ccache
          key: ccache2-core-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-core-${{ steps.ccache.outputs.key-prefix }}
            ccache2-core-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/crysta-sdk
        if: env.NIGHTLY == 'true'
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - uses: ./.github/actions/edi-native
        if: env.NIGHTLY == 'true'
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - name: crysta's source, whose lines no later step prints or stores
        if: env.NIGHTLY == 'true'
        uses: ./.github/actions/crysta-source
        with:
          sha: ${{ env.CRYSTA_SOURCE_SHA }}
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
      - name: Prepare notebooks
        if: env.NIGHTLY == 'true'
        run: pixi run notebook-prepare
      - name: Build the native code
        if: env.NIGHTLY == 'true'
        id: build
        run: pixi run core-build
      - name: Execute notebooks for rendering
        if: env.NIGHTLY == 'true'
        run: pixi run notebook-exec-ci
        env:
          # Name every test over a second, so a slow one shows in the log.
          PYTEST_ADDOPTS: --durations=0 --durations-min=1
      - name: Strict docs build
        if: env.NIGHTLY == 'true'
        run: pixi run docs-build
      # The repository keeps tutorial notebooks without outputs: run them, then build the public site from them.
      - name: Run the tutorial notebooks
        id: tutorials
        if: ${{ env.NIGHTLY == 'true' && (!cancelled() && steps.build.outcome == 'success') }}
        run: pixi run notebooks-run
      - name: Build the public site
        if: ${{ env.NIGHTLY == 'true' && (!cancelled() && steps.tutorials.outcome == 'success') }}
        run: pixi run site-build --require-outputs

  # The desktop app, one job per platform with a static name, so a skipped or cancelled job still shows its
  # platform. Linux and macOS share one step list (the `app-steps` anchor); Windows builds with MSVC below.
  app:
    name: app · Linux
    if: &app-if ${{ !cancelled() && needs.changes.result == 'success' && github.event.pull_request.head.repo.fork == false && inputs.core_only != true }}
    environment: crysta-sdk
    # It starts as soon as the native build and the SDK are ready, beside the core tests, so one round lists every
    # failure sooner.
    needs: &app-needs [changes, native, crysta-sdk]
    env:
      APP_PLATFORM: Linux
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
      # edi's own C++ builds without a warning (ADR-0093).
      EDI_WERROR: 'ON'
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    runs-on: *linux
    steps: &app-steps
      - *windows-git
      - *native-checkout
      - uses: ./.github/actions/setup-pixi
        if: runner.os != 'Windows'
      # Windows compiles the sources the Windows installer compiles, through the installer's own Qt, SDK and
      # compiler settings (tools/ci/app-windows-build.py). Of the app's tests it runs only the cases
      # tests/windows-app-cases.txt lists; the rest run on Linux and macOS.
      - name: Set up the locked packaging environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-pixi
        with:
          manifest-path: tools/installer/pixi.toml
      - *windows-compiler
      - name: Turn on the compiler cache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          {
            echo "CCACHE_DIR=${{ runner.temp }}/edi-ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >>"$GITHUB_ENV"
      - name: Restore the compiler cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/edi-ccache
          key: ccache2-app-windows-${{ hashFiles('tools/installer/pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-app-windows-${{ hashFiles('tools/installer/pixi.lock') }}-
            ccache2-app-windows-
      # The compiler cache (app), between runs: this job keeps it for the next run.
      - id: ccache
        if: runner.os != 'Windows'
        uses: ./.github/actions/ccache
        with:
          max-size: 1G
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ runner.os == 'Windows' && 'win-64' || runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - uses: ./.github/actions/edi-native
        if: runner.os != 'Windows'
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - *crysta-source
      - name: Unpack the pinned crysta source
        if: runner.os == 'Windows'
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python tools/ci/crysta_source_export.py "$CRYSTA_SRC" "$CRYSTA_SOURCE_SHA" .crysta
          printf '%s\n' "$CRYSTA_SOURCE_SHA" >.crysta/CRYSTA_SOURCE_SHA
      - name: Build the app with MSVC, warnings as errors
        id: windows-build
        if: runner.os == 'Windows'
        run: pixi run --manifest-path tools/installer/pixi.toml python tools/ci/app-windows-build.py --crysta-source .crysta --work build/app-windows
      - name: Save the compiler cache (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        uses: ./.github/actions/store
        with:
          ccache: pixi run --manifest-path tools/installer/pixi.toml python
          path: ${{ runner.temp }}/edi-ccache
          key: ccache2-app-windows-${{ hashFiles('tools/installer/pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Under the packaging environment, whose Qt the runner loads. A crash leaves a minidump, and each call's log
      # names every click and step (tools/ci/windows_app_cases.py).
      - name: App cases on Windows
        id: windows-cases
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 60
        run: >-
          pixi run --manifest-path tools/installer/pixi.toml python tools/ci/windows_app_cases.py
          --runner build/app-windows/app/edi_app_tests.exe --cases tests/windows-app-cases.txt
          --dumps build/app-windows/cases/dumps --logs build/app-windows/cases/logs
      - name: Upload the Windows app cases' logs and crash dumps
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.windows-cases.outcome != 'skipped' }}
        uses: ./.github/actions/store
        with:
          artifact: app-windows-cases
          withhold: 'true'
          path: build/app-windows/cases
          if-no-files-found: ignore
          retention-days: 7
      # A pull request builds and tests the app only when it changes an app input (tools/ci/app_inputs.py) or runs
      # paired with a crysta branch; main pushes, the nightly and manual runs always do (owner record 2026-11-09).
      - name: Decide whether this run builds and tests the app
        if: runner.os != 'Windows'
        id: inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pixi run python tools/ci/app_inputs.py "$BASE" HEAD >> "$GITHUB_OUTPUT"
      # The CI evidence accepts this job's skipped build and test steps only after this step succeeded.
      - name: App inputs unchanged, so the app is not built or tested
        if: ${{ runner.os != 'Windows' && (steps.inputs.outputs.run == 'false') }}
        run: echo "No app input changed since ${{ github.event.pull_request.base.sha }}; main's last run tested this app."
      # The compiler cache is saved right after the build, so a run whose tests fail still leaves it for the next run
      # (actions/cache saves only when the whole job succeeds, which left every red run's successor cold).
      - name: Restore the compiler cache
        if: ${{ runner.os != 'Windows' && (steps.inputs.outputs.run == 'true') }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/edi-ccache
          key: ccache2-app-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache2-app-${{ steps.ccache.outputs.key-prefix }}
            ccache2-app-${{ runner.os }}-${{ runner.arch }}-
      - name: Zero the compiler cache's statistics
        if: ${{ runner.os != 'Windows' && (steps.inputs.outputs.run == 'true') }}
        run: pixi run -e app ccache --zero-stats
      - name: Build the native code
        if: ${{ runner.os != 'Windows' && (steps.inputs.outputs.run == 'true') }}
        run: pixi run core-build
      - name: Build the app host, the test runner and the image comparator
        id: apphost
        if: ${{ runner.os != 'Windows' && (steps.inputs.outputs.run == 'true') }}
        run: pixi run -e app app-build
      - name: Compiler cache statistics
        if: ${{ runner.os != 'Windows' && (steps.inputs.outputs.run == 'true') }}
        run: pixi run -e app ccache --show-stats
      - name: Save the compiler cache
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.inputs.outputs.run == 'true') }}
        uses: ./.github/actions/store
        with:
          ccache: pixi run -e app --skip-deps python
          path: ~/.cache/edi-ccache
          key: ccache2-app-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      # The system tier's tutorial tests observe the app's project storage through an observer linked from this build.
      # The task also packs the build files the observer's receipt names, which the system jobs unpack before their
      # tests (tools/ci/tutorial_transaction_inputs.py).
      - name: Build the tutorial transaction observer for the system jobs
        id: observer
        if: ${{ runner.os != 'Windows' && ((github.event_name != 'pull_request') && steps.inputs.outputs.run == 'true') }}
        run: pixi run -e app --skip-deps tutorial-transactions
      # The system jobs run this app and its test runner rather than building their own. They go through this run's
      # cache, not an artifact: anyone can download a public repository's artifacts, and these are binaries.
      # The observer has its own entry, so a failed one does not cost them the app.
      - name: Keep the app and its test runner for the system jobs
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.inputs.outputs.run == 'true') }}
        uses: ./.github/actions/store
        with:
          path: |
            build/app/app/edi_app
            build/app/app/edi_app_tests
            build/app/app/edi_assistant_guard
          key: edi-app-${{ env.APP_PLATFORM }}-${{ github.run_id }}
      - name: Keep the tutorial transaction observer for the system jobs
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.observer.outcome == 'success') }}
        uses: ./.github/actions/store
        with:
          path: build/tutorial-transactions
          key: edi-observer-${{ env.APP_PLATFORM }}-${{ github.run_id }}
      # The checks and test tiers below need the app build, not each other: each runs and reports even when an
      # earlier one failed (owner, 2026-11-15).
      - name: Check assistant edits, controls and runtime lifetime
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.apphost.outcome == 'success') }}
        run: |
          status=0
          pixi run -e app --skip-deps app-test-trial-lock || status=1
          pixi run -e app --skip-deps app-test-assistant-groups || status=1
          pixi run -e app --skip-deps app-test-assistant-ui || status=1
          pixi run -e app --skip-deps app-test-skill-targets || status=1
          pixi run -e app --skip-deps app-test-assistant-lifetime || status=1
          pixi run -e app --skip-deps app-test-load-attempts || status=1
          exit $status
      # The integration tests whose wiring vectors run on the real app skip in the core job, which has no app. They
      # run here, on every run, on the test runner just built from this commit; without it they fail.
      - name: Native wiring vectors on this run's test runner
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.apphost.outcome != 'failure') }}
        run: pixi run --skip-deps native-wiring
        env:
          EDI_APP_TEST_RUNNER: ${{ github.workspace }}/build/app/app/edi_app_tests
      - name: qmllint over edi's QML (zero warnings)
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.inputs.outputs.run == 'true') }}
        run: pixi run -e app --skip-deps app-lint
      - name: qmlformat changes nothing
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.inputs.outputs.run == 'true') }}
        run: pixi run -e app --skip-deps app-format-check
      # The C++ static checks over edi's own code (ADR-0093), on the compile commands of the two trees built above.
      # They run after a failed step too, so one round lists every finding.
      - name: moc for every app target, which clang-tidy reads
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.inputs.outputs.run == 'true') }}
        run: pixi run -e app --skip-deps app-moc
      - name: clang-tidy with the Clang Static Analyzer (zero findings)
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.inputs.outputs.run == 'true') }}
        run: pixi run -e cpp-lint cpp-tidy
      - name: cppcheck (zero findings)
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.inputs.outputs.run == 'true') }}
        run: pixi run -e cpp-lint cpp-cppcheck
      # The Qt test prerequisites, made before the tests that use them and outside their timing: standalone
      # log, feedback and browser-geometry probes, plus a documentation capture from the app just built.
      - name: Prepare the onboarding test prerequisites
        id: onboarding
        if: ${{ runner.os != 'Windows' && (!cancelled() && github.event_name != 'pull_request' && steps.apphost.outcome == 'success') }}
        run: pixi run -e app --skip-deps onboarding-probes && pixi run -e app --skip-deps onboarding-capture
      # The Linux app contract consumes real traces on the runs that execute group-app.
      - name: Prepare the Linux app contract traces
        if: ${{ runner.os != 'Windows' && !cancelled() && env.APP_PLATFORM == 'Linux' && github.event_name != 'pull_request' && github.event_name != 'schedule' && steps.onboarding.outcome == 'success' }}
        run: pixi run -e app --skip-deps app-watchdog --prepare-only
      # R1 reports GUI pauses on the nightly schedule and still verifies the injected controls.
      - name: Report the nightly GUI watchdog scenarios
        if: ${{ runner.os != 'Windows' && !cancelled() && env.APP_PLATFORM == 'Linux' && github.event_name == 'schedule' && steps.apphost.outcome == 'success' }}
        run: pixi run -e app --skip-deps app-watchdog
      - name: Upload the GUI watchdog's records
        if: ${{ runner.os != 'Windows' && !cancelled() && env.APP_PLATFORM == 'Linux' && github.event_name != 'pull_request' && steps.apphost.outcome == 'success' }}
        uses: ./.github/actions/store
        with:
          artifact: app-watchdog-${{ env.APP_PLATFORM }}
          withhold: 'true'
          path: |
            build/app/watchdog/runs/*/trace.jsonl
            build/app/watchdog/runs/*/app.log
            build/app/watchdog/runs/manifest.json
          if-no-files-found: ignore
      # About 9 minutes on each platform, so main pushes, the nightly and manual runs only.
      - name: The app group's Python tests (tests/integration/app)
        if: ${{ runner.os != 'Windows' && (!cancelled() && github.event_name != 'pull_request' && steps.onboarding.outcome == 'success') }}
        run: pixi run --skip-deps group-app
        env:
          # Name every test over a second, so a slow one shows in the log.
          PYTEST_ADDOPTS: --durations=0 --durations-min=1
          # The watchdog's fresh observations of this build, for the UI acceptance tests (Linux, where they are made).
          EDI_UI_EVIDENCE: ${{ github.workspace }}/build/app/watchdog/runs
      # The app's own tests run only at night and on a manual run.
      - name: The app's Qt Quick Test tier
        if: ${{ runner.os != 'Windows' && (!cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.apphost.outcome == 'success') }}
        # Qt Test's own per-function limit is 5 min; 4 min (the slowest data row seen took 83 s) names a hung test.
        timeout-minutes: 120
        env:
          QTEST_FUNCTION_TIMEOUT: '240000'
        run: pixi run -e app --skip-deps app-test
      - name: The UI test against the one committed image set
        if: ${{ runner.os != 'Windows' && (!cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.apphost.outcome == 'success') }}
        run: pixi run -e app --skip-deps app-ui-test
      - name: Upload the UI test's images and similarity maps
        if: ${{ runner.os != 'Windows' && (!cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.apphost.outcome == 'success') }}
        uses: ./.github/actions/store
        with:
          artifact: app-ui-${{ env.APP_PLATFORM }}
          withhold: 'true'
          path: |
            build/app/ui-actual
            build/app/ui-diff
          if-no-files-found: ignore
          retention-days: 7  # a red UI check is inspected within days
      # Each delivered surface carries the notices of exactly the components it ships, checked on the real outputs this
      # job has built: the desktop install, the Python wheel and the CLI with the notices its build puts beside it
      # (tests/system/py/test_distribution_licences.py, which the system parts leave to this job and app-wasm). On
      # Linux only: the lists do not depend on the platform.
      - name: Stage the desktop, Python and CLI surfaces
        id: surfaces
        if: ${{ runner.os != 'Windows' && (!cancelled() && env.APP_PLATFORM == 'Linux' && steps.apphost.outcome == 'success') }}
        run: pixi run --skip-deps python tests/fixtures/distribution_licences/stage.py --surfaces desktop,python,cli
      - name: Check those surfaces' notices
        if: ${{ runner.os != 'Windows' && (!cancelled() && steps.surfaces.outcome == 'success') }}
        run: pixi run --skip-deps python -m pytest tests/system/py/test_distribution_licences.py -k "desktop or python or cli"
      - name: app-build recovers a build/app configured under another toolchain
        if: ${{ runner.os != 'Windows' && (!cancelled() && needs.changes.outputs.app_build == 'true' && steps.inputs.outputs.run == 'true') }}
        run: pixi run -e app --skip-deps app-build-recovery
      - name: Compile the app for WebAssembly
        if: ${{ runner.os != 'Windows' && (!cancelled() && env.APP_PLATFORM == 'Linux') }}
        run: echo "WebAssembly builds and browser checks run in the dedicated app · WebAssembly job."

  app-macos:
    name: app · macOS
    if: *app-if
    environment: crysta-sdk
    needs: *app-needs
    env:
      APP_PLATFORM: macOS
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
      EDI_WERROR: 'ON'
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    runs-on: *macos
    steps: *app-steps

  app-windows:
    name: app · Windows
    if: *app-if
    environment: crysta-sdk
    needs: *app-needs
    env:
      APP_PLATFORM: Windows
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
      EDI_WERROR: 'ON'
    runs-on: windows-2022
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    steps: *app-steps

  # The app as a WebAssembly site (ADR-0023): the multithread kit, start page and isolation shim,
  # packed as one site folder and uploaded as the `edi-webapp` artifact. The toolchain (Emscripten, Qt's wasm
  # kit, Eigen, Chrome) installs into the runner's ~/.cache/edi-wasm on each run. crysta is compiled for
  # wasm from the pinned SDK's source.
  app-wasm:
    name: app · WebAssembly
    # Browser input changes qualify the multithread kit and both isolation routes on pull requests too.
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.event.pull_request.head.repo.fork == false && (github.event_name != 'pull_request' || needs.changes.outputs.wasm_build == 'true') && inputs.core_only != true }}
    environment: crysta-sdk
    # Browser qualification restores the native producer artifact after it finishes;
    # its own scientific checks remain independent of the native test outcome.
    needs: [changes, native, crysta-sdk]
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    runs-on: *linux
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
      # edi's own C++ builds without a warning under Emscripten's Clang too (ADR-0093).
      EDI_WERROR: 'ON'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the app's version line is `git describe`
      - uses: ./.github/actions/setup-pixi
      - uses: ./.github/actions/wasm-cache
        id: wasm-cache
      # Installed and kept before crysta's source is on the runner, so it needs no check against it.
      - name: Install the WebAssembly toolchain  # Emscripten, Qt's wasm kits, Eigen, Chrome
        id: toolchain
        shell: bash
        run: pixi run -e app wasm-toolchain
      - name: Save the WebAssembly toolchain
        if: steps.wasm-cache.outputs.toolchain-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/edi-wasm
          key: ${{ steps.wasm-cache.outputs.toolchain }}
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - uses: ./.github/actions/edi-native
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - *crysta-source
      # The pinned crysta SDK and its source (the wasm builds compile that source), and the native build the
      # checks' tests import.
      - name: Build the native code
        run: pixi run core-build
      # The survey test and the site build each need only the toolchain, so one failing does not hide the other.
      - name: Survey event windows in the browser
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: pixi run --skip-deps python -m pytest tests/system/py/test_survey_events.py
      - name: Reset browser compiler-cache statistics
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: pixi run --skip-deps ccache --zero-stats
      - name: Build the multithread kit and pack the site
        id: site
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: pixi run -e app --skip-deps wasm-build
      - name: Browser compiler-cache statistics
        if: ${{ !cancelled() }}
        run: pixi run --skip-deps ccache --show-stats --verbose
      - name: Save the WebAssembly compiler cache
        if: ${{ !cancelled() && steps.wasm-cache.outcome == 'success' }}
        uses: ./.github/actions/store
        with:
          ccache: pixi run --skip-deps python
          path: ~/.cache/edi-ccache
          key: ${{ steps.wasm-cache.outputs.objects }}
      - name: Upload the site
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        uses: ./.github/actions/store
        with:
          artifact: edi-webapp
          path: build/wasm/site
          if-no-files-found: error
          # The repository's default retention: the site is downloaded by hand.
      - name: Retain the browser CLI and its source identity
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        uses: ./.github/actions/store
        with:
          artifact: edi-wasm-cli
          path: |
            build/wasm/multithread/crysta-prefix/bin/crysta*
            build/wasm/multithread/crysta-prefix/.edi-wasm-key
            build/wasm/multithread/app/app/CRYSTA_SOURCE_SHA
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      # The wasm crysta CLI's fit against the native reference, the zip's contents, and the app in headless
      # Chrome for each build.
      - name: Check the site in the browser
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: >-
          pixi run --skip-deps wasm-check "$RUNNER_TEMP/edi-webapp-checks" tests/system/manual/e04_t11_browser.mjs
          tests/system/py/test_e04_t11_wasm_fit.py tests/system/py/test_e04_t11_wasm_delivery.py tests/system/py/test_web_multithread_loader.py
      - name: Check the first click after opening a project
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: >-
          pixi run --skip-deps wasm-check "$RUNNER_TEMP/edi-webapp-checks/first-click" tests/system/manual/e04_t11_browser.mjs
          --project-open-click-only
      # The multithread kit's parallel fit: all three routes timed against each other (the speed ratio is in the log)
      # and crysta's executed-body witness built from the same crysta source with the same options. It takes about
      # 20 minutes, so it runs on main pushes, the nightly run and dispatch, not on pull requests.
      - name: Check the parallel engine in the browser
        if: ${{ !cancelled() && steps.site.outcome == 'success' && github.event_name != 'pull_request' }}
        run: pixi run --skip-deps wasm-parallel-check "$RUNNER_TEMP/edi-webapp-checks/parallel"
      - name: Upload the browser checks' screenshots and logs
        if: always()
        uses: ./.github/actions/store
        with:
          artifact: edi-webapp-checks
          withhold: 'true'
          path: ${{ runner.temp }}/edi-webapp-checks
          retention-days: 7
          if-no-files-found: ignore
      # The site built above carries the notices of exactly the components it ships
      # (tests/system/py/test_distribution_licences.py, whose other surfaces the app job checks).
      - name: Stage the web surface
        if: ${{ !cancelled() }}
        run: pixi run --skip-deps python tests/fixtures/distribution_licences/stage.py --surfaces web
      - name: Check the web surface's notices
        if: ${{ !cancelled() }}
        run: pixi run --skip-deps python -m pytest tests/system/py/test_distribution_licences.py -k web
