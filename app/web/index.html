<!doctype html>
<!--
  The EasyDiffraction web app's start page (ADR-0023). Only the multithreaded build is shipped.
  Its content-named folder is read from build.json past caches to keep loader and module together.
  Browser threading needs cross-origin isolation and SharedArrayBuffer. The service worker supplies
  COOP/COEP on hosts without response headers; if isolation cannot be enabled, show a startup error.
  The splash and saved colour scheme match the app while it downloads, compiles and starts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
    <title>EasyDiffraction</title>
    <style>
      /* The app's content background and text colour, light and dark (gui-components Style/Colors.qml). */
      :root { --background: #f4f4f4; --foreground: #333; }
      :root[data-scheme="dark"] { --background: #3a3a3a; --foreground: #eee; }
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: var(--background); }
      #screen { width: 100%; height: 100%; display: none; }
      #loading {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em;
        height: 100%; color: var(--foreground); font: 16px sans-serif;
      }
      /* The full logo at its size on the app's Home page (a 70 px mark; the owner, 2026-10-03). */
      #splash { width: 224px; }
      #still { width: 200px; display: none; }
    </style>
    <link rel="stylesheet" href="splash.css">
    <script>
      // The colour scheme before anything is drawn: the app's own choice, from its settings file, which the web
      // build keeps in local storage (`edi.settings.ini`; [Preferences.Appearance] theme: 0 light, 1 dark, 2 the
      // system's), else the system's.
      (() => {
        let theme = 2;
        try {
          const settings = localStorage.getItem("edi.settings.ini") || "";
          const section = settings.split(/^\[/m).find((s) => s.startsWith("Preferences.Appearance]")) || "";
          const match = section.match(/^theme=(\d)/m);
          if (match) {
            theme = Number(match[1]);
          }
        } catch (e) {
          // no storage (a private window, blocked site data): the system's scheme
        }
        const dark = theme === 1 || (theme !== 0 && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.scheme = dark ? "dark" : "light";
      })();
    </script>
    <script>
      // coi-serviceworker's page half only tells the worker which COEP mode to send; this page registers the worker
      // itself, so that it knows when to give up. The mode is require-corp in every browser: every file the app loads
      // is same-origin, and Safari does not isolate a page under the shim's default there, credentialless.
      window.coi = { shouldRegister: () => false, coepCredentialless: () => false, quiet: true };
    </script>
    <script src="coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="loading">
      <div id="splash" role="img" aria-label="EasyDiffraction">
        <img class="name" id="name" src="name.svg" alt="">
        <img class="mark" src="mark.svg" alt="">
      </div>
      <img id="still" src="logo.svg" alt="EasyDiffraction">
      <script>
        if (document.documentElement.dataset.scheme === "dark") {
          document.getElementById("name").src = "name-dark.svg";
          document.getElementById("still").src = "logo-dark.svg";
        }
      </script>
      <div id="status">Loading...</div>
      <noscript>EasyDiffraction needs JavaScript.</noscript>
    </div>
    <div id="screen"></div>
    <script>
      "use strict";
      const statusLine = document.getElementById("status");

      // The page has a message instead of the app: the logo stops turning.
      function showMessage(text) {
        document.getElementById("splash").style.display = "none";
        document.getElementById("still").style.display = "block";
        statusLine.textContent = text;
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`cannot load ${src}`));
          document.body.appendChild(script);
        });
      }

      function sessionStore() {
        try {
          return window.sessionStorage;
        } catch (e) {
          return null;
        }
      }

      // Enable isolation once through the service worker when the host supplies no headers.
      // The reload marker is consumed on every visit, so a later stale worker can be retried.
      async function chooseBuild(deploy) {
        const requested = new URLSearchParams(location.search).get("build");
        if (requested && requested !== "multithread") {
          throw new Error("Only the multithreaded build is available. Remove the build parameter from the address.");
        }
        const session = sessionStore();
        const reloaded = session && session.getItem("edi.coi-reloaded");
        if (session) {
          session.removeItem("edi.coi-reloaded");
          session.removeItem("edi.coi-reload");
          session.removeItem("edi.fallback-reason");
        }
        if (self.crossOriginIsolated && typeof SharedArrayBuffer === "function") {
          return { build: "multithread", reason: "the page is cross-origin isolated and has SharedArrayBuffer" };
        }
        if (!window.isSecureContext) {
          throw new Error("Browser threading requires HTTPS or localhost. Open the app over a secure connection.");
        }
        if (self.crossOriginIsolated) {
          throw new Error("Browser threading is unavailable. Use a current browser that allows shared memory.");
        }
        if (!navigator.serviceWorker) {
          throw new Error("Browser threading requires cross-origin isolation. The server must send COOP/COEP headers because service workers are unavailable.");
        }
        if (!session) {
          throw new Error("Browser threading requires cross-origin isolation. Allow session storage for automatic setup, or configure the server's COOP/COEP headers.");
        }
        if (reloaded === deploy) {
          throw new Error("Browser threading is still unavailable after setup. Check that the server allows cross-origin isolation and shared memory.");
        }
        let timer;
        try {
          await navigator.serviceWorker.register("coi-serviceworker.js");
          await Promise.race([
            navigator.serviceWorker.ready,
            new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("service worker activation timed out")), 15000); }),
          ]);
          session.setItem("edi.coi-reloaded", deploy);
          location.reload();
          return null;
        } catch (e) {
          throw new Error(`Browser threading could not be enabled. Check the server's COOP/COEP headers or allow the isolation service worker: ${e.message}`);
        } finally {
          clearTimeout(timer);
        }
      }

      // Each build's folder, from build.json, never from a cache: a redeploy names new folders.
      async function buildFolders() {
        const response = await fetch("build.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`cannot read build.json (${response.status})`);
        }
        return response.json();
      }

      // The module, downloaded once and compiled here: streamed when the host labels it application/wasm, else from
      // its bytes (a host serving it as text/plain makes Emscripten's own streaming fail and download it again).
      async function loadModule(url) {
        const response = await fetch(url, { credentials: "same-origin" });
        if (!response.ok) {
          throw new Error(`cannot download ${url} (HTTP ${response.status})`);
        }
        if ((response.headers.get("content-type") || "").startsWith("application/wasm")) {
          return WebAssembly.compileStreaming(response);
        }
        return WebAssembly.compile(await response.arrayBuffer());
      }

      let started = "";
      let startedReason = "";
      // A page being left aborts downloads; do not report that as a startup failure.
      let leaving = false;
      window.addEventListener("pagehide", () => {
        leaving = true;
      });

      async function start() {
        const folders = await buildFolders();
        if (typeof folders.multithread !== "string" || !/^multithread-[0-9a-f]+$/.test(folders.multithread)) {
          throw new Error("build.json names no multithread build");
        }
        const chosen = await chooseBuild(folders.multithread);
        if (chosen === null) {
          return;
        }
        const build = chosen.build;
        started = build;
        startedReason = chosen.reason;
        // What the app's diagnostics view shows about this choice (Preferences > Advanced).
        window.ediBuildInfo = {
          build,
          reason: chosen.reason,
          deploy: folders.multithread,
        };
        const folder = folders[build];
        if (typeof folder !== "string" || !/^[a-z]+-[0-9a-f]+$/.test(folder)) {
          throw new Error(`build.json names no ${build} build`);
        }
        window.ediBuild = build;
        document.documentElement.dataset.build = build;
        console.log(`edi: the ${build} build: ${chosen.reason} (crossOriginIsolated: ${self.crossOriginIsolated})`);
        await loadScript(`${folder}/qtloader.js`);
        await loadScript(`${folder}/edi_app.js`);
        const screen = document.getElementById("screen");
        // A released web app's build.json names the release it was archived as; the app shows that version when the
        // commit is its own (ApplicationInfo::version).
        const release = folders.release && typeof folders.release.version === "string" ? folders.release : null;
        const environment = release ? { EDI_RELEASE_VERSION: release.version, EDI_RELEASE_COMMIT: String(release.commit || "") } : {};
        await qtLoad({
          locateFile: (file) => `${folder}/${file}`,
          qt: {
            environment,
            module: loadModule(`${folder}/edi_app.wasm`),
            onLoaded: () => {
              document.getElementById("loading").style.display = "none";
              screen.style.display = "block";
            },
            onExit: (exit) => {
              if (leaving) {
                return;
              }
              screen.style.display = "none";
              document.getElementById("loading").style.display = "flex";
              showMessage(`EasyDiffraction stopped${exit.code !== undefined ? ` (code ${exit.code})` : ""}${exit.text !== undefined ? `: ${exit.text}` : ""}`);
            },
            entryFunction: window.edi_app_entry,
            containerElements: [screen],
          },
        });
      }

      start().catch((e) => {
        if (leaving) {
          return;
        }
        const which = started ? ` the ${started} build (chosen because ${startedReason})` : "";
        showMessage(`EasyDiffraction could not start${which}: ${e.message}`);
        console.error(e);
      });
    </script>
  </body>
</html>
