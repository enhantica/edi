# The documentation site on GitHub Pages, with the web app at /webapp/. The site is built from main (or
# by dispatch) with the notebooks executed for rendering, which needs crysta's SDK; the web app is built
# as CI's `app · WebAssembly` job builds it and placed into the site (ADR-0023).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    if: github.event.pull_request.head.repo.fork == false
    environment: crysta-sdk
    runs-on: &linux ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Prepare notebooks
        run: pixi run notebook-prepare
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      # Preview build: crysta from source at the branch's paired commit, no native build, so the notebooks are
      # published unexecuted.
      - name: Check out crysta for the web app
        uses: actions/checkout@v5
        with:
          repository: enhantica/crysta
          ref: 0579956fb2d012fd3815ff6f5deff6fbf99cf184
          token: ${{ steps.crysta-token.outputs.token }}
          path: crysta-source
      - name: Strict docs build
        run: pixi run docs-build
      - name: Install the WebAssembly toolchain  # Emscripten, Qt's wasm kits, Eigen, Chrome
        run: pixi run -e app wasm-toolchain
      # dev only: a compiler cache kept between dev builds, so later builds recompile only what changed.
      - id: ccache
        uses: ./.github/actions/ccache
        with:
          max-size: 2G
      - uses: actions/cache@v4
        with:
          path: ~/.cache/edi-ccache
          key: ccache-wasm-dev-${{ steps.ccache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-wasm-dev-${{ steps.ccache.outputs.key-prefix }}
            ccache-wasm-dev-${{ runner.os }}-${{ runner.arch }}-
            ccache-wasm-${{ runner.os }}-${{ runner.arch }}-
      # dev only: the multithread kit alone (about half the build time); its files also fill the singlethread
      # slot so the pack step runs. Browsers without cross-origin isolation are not served on dev.
      - name: Build the multithread kit and pack the web app
        run: |
          pixi run -e app --skip-deps wasm-build multithread
          mkdir -p build/wasm/singlethread/app/app
          cp build/wasm/multithread/app/app/{edi_app.js,edi_app.wasm,qtloader.js,CRYSTA_SOURCE_SHA} build/wasm/singlethread/app/app/
          pixi run -e app --skip-deps bash tools/ci/wasm-pack.sh
        env:
          EDI_WASM_CRYSTA_SRC: ${{ github.workspace }}/crysta-source
      - name: Place the web app at /webapp/
        run: bash tools/ci/docs-webapp.sh build/wasm/site site
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy the site
    needs: build
    # A Pages site is publicly visible, so it deploys only while the repository is public.
    if: github.event.repository.private == false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: *linux
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
