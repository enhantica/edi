name: 'Setup pixi'
description: >-
  Thin wrapper over prefix-dev/setup-pixi that installs the pixi version the given manifest pins
  (its requires-pixi, read by tools/ci/pixi-launcher.sh) and pins the action version and the edi CI
  install flags in one place: install with a frozen lock (the committed pixi.lock is authoritative
  in CI) and skip the post-job cleanup. A job given crysta's manifest gets crysta's version.
inputs:
  manifest-path:
    description: Pixi workspace manifest
    default: pixi.toml
  environments:
    description: Locked Pixi environments to install
    default: default
  cache:
    description: Cache the complete selected Pixi environment
    default: "true"
  install:
    description: Install the environments here; "false" leaves it to a later run step
    default: "true"
runs:
  using: 'composite'
  steps:
    # The launcher's own parser, so CI runs exactly the version a local run of that manifest runs.
    # It prints nothing it read, so it may run beside crysta's source (tools/ci/source_publishers.py).
    - id: pin
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest-path }}
      run: |
        launcher="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)/tools/ci/pixi-launcher.sh"
        if ! version="$(bash "$launcher" --launcher-pin "$MANIFEST" 2>/dev/null)"; then
          echo "setup-pixi: the manifest does not pin one exact pixi version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: prefix-dev/setup-pixi@v0.9.6
      with:
        pixi-version: v${{ steps.pin.outputs.version }}
        # Install the pinned launcher to a JOB-SCOPED path, never the default ~/.pixi/bin/pixi:
        # on a persistent self-hosted runner that path already exists, and setup-pixi's pinned
        # download refuses to overwrite an existing file ("Destination file path ... already
        # exists" — crysta PR #135 macOS leg), leaving a stale wrong-version launcher that
        # requires-pixi then rejects. runner.temp is cleaned per job, so the pinned download
        # always succeeds, is prepended to PATH for the job, and never clobbers the machine's
        # shared ~/.pixi/bin (which the hub VM also uses).
        pixi-bin-path: ${{ runner.temp }}/pinned-pixi/pixi${{ runner.os == 'Windows' && '.exe' || '' }}
        manifest-path: ${{ inputs.manifest-path }}
        # setup-pixi refuses environments, a cache or a frozen lock when it installs nothing.
        environments: ${{ inputs.install == 'true' && inputs.environments || '' }}
        cache: ${{ inputs.install == 'true' && inputs.cache || 'false' }}
        # Pull requests restore environment caches and never write them; edi's 10 GB is shared by every job.
        cache-write: ${{ github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run-install: ${{ inputs.install }}
        frozen: ${{ inputs.install }}
        post-cleanup: false
