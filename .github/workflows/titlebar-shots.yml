name: Title bar experiment

on:
  push:
    branches: [titlebar-experiment]

permissions:
  contents: read
  actions: read

concurrency:
  group: titlebar-experiment-${{ github.event_name == 'push' && github.ref || inputs.prepare_preview_release && format('calendar-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # The crysta SDK, built once per crysta commit (edi ADR-0083).
  crysta-sdk:
    uses: ./.github/workflows/crysta-sdk.yml
    secrets: inherit

  preview-version:
    if: github.event.pull_request.head.repo.fork == false && inputs.prepare_preview_release && inputs.preview_run == ''
    environment: crysta-sdk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.select.outputs.version }}
      date: ${{ steps.select.outputs.date }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Reserve this source's calendar version
        id: select
        env:
          # Reserving creates an empty draft, which needs the release token used for drafts.
          GH_TOKEN: ${{ secrets.GH_API_PERSONAL_ACCESS_TOKEN }}
          PYTHONPATH: tools/release
        run: |
          python - <<'PYTHON'
          import datetime
          import os
          from pathlib import Path
          from prepare import reserve_identity
          today = datetime.datetime.now(datetime.UTC).date()
          version, date = reserve_identity(
              os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'], today, prerelease=True
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\ndate={date.isoformat()}\n')
          PYTHON

  installers:
    needs: [preview-version, crysta-sdk]
    if: >-
      github.event.pull_request.head.repo.fork == false && !cancelled() && inputs.preview_run == ''
      && (needs.preview-version.result == 'success' || needs.preview-version.result == 'skipped')
    name: installer · ${{ matrix.runner == 'windows-2022' && 'Windows' || matrix.runner == 'macos-15' && 'macOS' || 'Linux' }}
    environment: crysta-sdk
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Every platform is written out; a Windows diagnostic (windows_only) drops Linux and macOS.
      matrix:
        runner: [macos-15, windows-2022]
        exclude:
          - runner: ${{ inputs.windows_only && 'ubuntu-24.04' || 'none' }}
          - runner: ${{ inputs.windows_only && 'macos-15' || 'none' }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      EDI_INSTALLER_PREVIEW_DATE: ${{ needs.preview-version.outputs.date }}
      EDI_RELEASE_PLAN: ${{ inputs.release_plan_run && format('{0}/build/release-plan', github.workspace) || '' }}
      EDI_INSTALLER_VERSION: 0.0.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Apply the prerelease version
        if: inputs.prepare_preview_release
        shell: bash
        env:
          RELEASE_PLAN_RUN: ${{ inputs.release_plan_run }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
          PREVIEW_VERSION: ${{ needs.preview-version.outputs.version }}
        run: |
          if [[ -n "$RELEASE_PLAN_RUN" || "$WINDOWS_ONLY" == true ]]; then
            echo "A calendar preview is separate from stable qualification and Windows diagnostics."
            exit 1
          fi
          [[ -n "$PREVIEW_VERSION" ]]
          printf 'EDI_INSTALLER_VERSION=%s\nEDI_INSTALLER_PREVIEW_VERSION=%s\n' "$PREVIEW_VERSION" "$PREVIEW_VERSION" >> "$GITHUB_ENV"
      - name: Reject publication inputs for a Windows diagnostic
        if: inputs.windows_only && (inputs.publish_components || inputs.release_plan_run != '')
        shell: bash
        run: |
          echo "Windows diagnostics cannot publish or qualify a release."
          exit 1
      - name: Enable long source paths on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.protectNTFS false
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'
        with:
          fetch-depth: 0
      - name: Check out Windows-compatible source paths
        if: runner.os == 'Windows'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !**/[aA][uU][xX]
            !**/[aA][uU][xX].*
            !**/[cC][oO][nN]
            !**/[cC][oO][nN].*
            !**/[pP][rR][nN]
            !**/[pP][rR][nN].*
            !**/[nN][uU][lL]
            !**/[nN][uU][lL].*
            !**/[cC][oO][mM][1-9]
            !**/[cC][oO][mM][1-9].*
            !**/[lL][pP][tT][1-9]
            !**/[lL][pP][tT][1-9].*
      - name: Set up the locked packaging environment
        uses: ./.github/actions/setup-pixi
        with:
          manifest-path: tools/installer/pixi.toml
      - name: Set up the Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'
      # The compiler cache, kept per platform between runs: a re-run of the same or a nearby commit compiles only
      # what changed. ccache hands back the object the compiler wrote for the same input, so the release bytes
      # do not depend on it. Keyed on the packaging lock, which fixes the compilers; restored from the newest entry.
      - name: Turn on the compiler cache
        shell: bash
        run: |
          {
            echo "CCACHE_DIR=${{ runner.temp }}/edi-ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >>"$GITHUB_ENV"
      - id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/edi-ccache
          key: ccache-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/installer/pixi.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/installer/pixi.lock') }}-
            ccache-installer-${{ runner.os }}-${{ runner.arch }}-
      - name: Acquire source-bound release inputs
        if: inputs.release_plan_run != ''
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/release/download_plan.py" --repo "$GITHUB_REPOSITORY" --run "$PREPARE_RUN" --output "$EDI_RELEASE_PLAN"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN: ${{ inputs.release_plan_run }}
      - name: Validate calendar release policy offline
        run: pixi run --manifest-path tools/installer/pixi.toml python -m pytest "${{ github.workspace }}/tests/fixtures/releases" --noconftest -o addopts= -o python_files="check_*.py" --ignore="${{ github.workspace }}/tests/fixtures/releases/check_notebook_package_origin.py" -q
      - name: Check installer boundaries and native UTC conversion offline
        run: pixi run --manifest-path tools/installer/pixi.toml python -m pytest "${{ github.workspace }}/tests/fixtures/installer" --noconftest -o addopts= -o python_files="check_*.py" -q
      - name: Acquire the pinned Qt Installer Framework
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" tools --output "${{ github.workspace }}/build/installer/ifw"
      - name: Check installer transport before building the application
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/protocol_check.py" --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/protocol"
      - name: The pinned crysta commit
        shell: bash
        run: echo "CRYSTA_SOURCE_COMMIT=$(sed -n 's/^CRYSTA_COMMIT = "\([0-9a-f]\{40\}\)" *$/\1/p' pixi.toml)" >>"$GITHUB_ENV"
      - name: Require an immutable engine source
        shell: bash
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import os, re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['CRYSTA_SOURCE_COMMIT']):
              raise RuntimeError('Installer qualification requires a complete engine commit')
          PYTHON
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ runner.os == 'Windows' && 'win-64' || runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - name: Unpack the pinned crysta source
        shell: bash
        run: |
          mkdir -p .crysta
          pixi run --manifest-path tools/installer/pixi.toml python tools/ci/crysta_source_archive.py extract "$CRYSTA_SDK_ARCHIVES/crysta-src-$CRYSTA_SOURCE_COMMIT.tar.gz" .crysta
          printf '%s\n' "$CRYSTA_SOURCE_COMMIT" >.crysta/CRYSTA_SOURCE_SHA
      - name: Check engine compiler portability before the full build
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/build.py" --check-compiler --crysta-source "${{ github.workspace }}/.crysta" --work "${{ github.workspace }}/build/installer"
      - name: Fetch the data collection for the offline copy
        run: git clone --depth 1 https://github.com/enhantica/edi-data "${{ github.workspace }}/.edi-data"
      - name: Build desktop bundle and CLI with the qualified SDK
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/build.py" --crysta-source "${{ github.workspace }}/.crysta" --work "${{ github.workspace }}/build/installer" --collection "${{ github.workspace }}/.edi-data"
      - name: Start the app and capture the window
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/installer -Recurse -Include EasyDiffraction*.exe,edi_app.exe | Where-Object { $_.FullName -notmatch 'maintenance|installer\\tools' } | Select-Object -First 1
          Write-Host "app: $($exe.FullName)"
          $env:QT_LOGGING_RULES = "qml.info=true"
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardError app-stderr.txt -RedirectStandardOutput app-stdout.txt
          Start-Sleep -Seconds 40
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("titlebar-windows.png"); Stop-Process -Id $p.Id -Force
      - name: Start the app and capture the window
        if: runner.os == 'macOS'
        run: |
          app=$(find build/installer -maxdepth 4 -name 'EasyDiffraction.app' -type d | head -1)
          echo "app: $app"
          open "$app"; sleep 40
          screencapture -x titlebar-macos.png || true
          pkill -f EasyDiffraction || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titlebar-${{ runner.os }}
          path: |
            titlebar-*.png
            app-std*.txt
