# edi's CI for a public repository, on GitHub-hosted runners. The runner of each platform is named
# once, as a YAML anchor: `&linux` on the `changes` job and `&macos` in the native job's matrix.
#
# A job that builds against crysta needs a read token for crysta's prebuilt SDK, so it runs only for
# events from this repository (never a fork's pull request) and in the reviewed `crysta-sdk`
# environment, which holds the app key. A fork's pull request runs the jobs that need no token, and
# the pin-currency job without its token steps.
# Each job builds the native code itself: no artifact carries crysta's object code, and no
# artifact is named after a runner. The latency bank runs on the self-hosted fleet, by dispatch
# only (bank-latency.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      # A repair round's fast signal: changes, pin currency, native and core (and the dispatch-only
      # cli-native placeholder). It skips required jobs, so its head is not merge evidence.
      core_only:
        description: Run only the native builds and the core test jobs (not evidence)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: &linux ubuntu-24.04
    outputs:
      app_build: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app_build == 'true' }}
      crysta_sha: ${{ steps.crysta-source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Read the crysta pin
        id: crysta-source
        run: pixi run bash tools/ci/crysta-source.sh
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app_build: ['tools/ci/app-build.sh']

  pin-currency:
    name: pin currency
    # Unconditional on every event (a stale pin never passes by a skipped job); the two steps that use
    # the token are what a fork's pull request skips, so the token never reaches it.
    environment: crysta-sdk
    runs-on: *linux
    steps:
      - uses: actions/checkout@v5
      - name: Mint a crysta installation token
        if: github.event.pull_request.head.repo.fork == false
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - uses: ./.github/actions/setup-pixi
      - name: Check the crysta pin is current
        if: github.event.pull_request.head.repo.fork == false
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
        run: pixi run bash tools/ci/crysta-source.sh --currency

  lint:
    name: lint
    if: inputs.core_only != true
    runs-on: *linux
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Ruff lint + format, entity-path convention
        run: |
          pixi run check
          pixi run format-check
          pixi run entity-path-check
      - name: Static policy checks (weakref, tutorial exclusions, generated regions)
        run: |
          pixi run weakref-policy
          pixi run tutorial-exclusions
          pixi run generated-regions
          pixi run category-census-check

  native:
    name: native · ${{ matrix.platform }}
    if: github.event.pull_request.head.repo.fork == false
    environment: crysta-sdk
    needs: changes
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
            sdk: linux-64
          - platform: macOS
            runner: &macos macos-15
            sdk: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Build the native code once (core-build, then edi_tests in the same tree)
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
          EDI_CORE_TARGETS: edi_tests
      - name: C++ unit tests
        run: pixi run --skip-deps cpp-test

  audit:
    name: audit
    if: github.event.pull_request.head.repo.fork == false && inputs.core_only != true
    environment: crysta-sdk
    # After the core tests, which take the runners first; a core failure cancels the run before these start.
    needs: [changes, core]
    runs-on: *linux
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Build the native code
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Runtime-manifest equality audit
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
        run: pixi run per-pr-audit

  core:
    name: core · ${{ matrix.platform }}
    if: github.event.pull_request.head.repo.fork == false
    environment: crysta-sdk
    needs: changes
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
            sdk: linux-64
          - platform: macOS
            runner: *macos
            sdk: osx-arm64
    runs-on: ${{ matrix.runner }}
    # `actions: write` for the cancel step at the end.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pixi
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Build the native code
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: The crysta consumer proof
        run: pixi run crysta-consumer
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Python surface and CLI vocabulary checks
        run: |
          pixi run --skip-deps python-surface-superset
          pixi run --skip-deps python-surface-check
          pixi run --skip-deps cli-vocabulary-check
      - name: Tests (declared group)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pixi run group-quick
          else
            pixi run group-full
          fi
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: The two-thread witness (ThreadSanitizer)
        if: matrix.platform == 'Linux'
        run: pixi run --skip-deps tsan-worker
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      # A core failure ends the run, so the red arrives in minutes and no runner spends time on a head
      # that is already red. A cancelled run is never merge evidence.
      - name: Cancel the run after a core failure
        if: failure()
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  notebooks:
    name: notebooks
    # Runs for every result-changing surface, so no job condition: the steps that use the crysta
    # token, and the run that needs their build, carry the fork guard (a fork's pull request skips
    # this job anyway, through the native job it needs).
    if: inputs.core_only != true
    environment: crysta-sdk
    # After the native build and the core tests of this run, which take the runners first; a core failure
    # cancels the run before these start. Each job still builds its own tree (no artifact carries crysta).
    needs: [changes, native, core]
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    runs-on: *linux
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Mint a crysta installation token
        if: github.event.pull_request.head.repo.fork == false
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Build the native code
        if: github.event.pull_request.head.repo.fork == false
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Execute the verification notebooks
        if: github.event.pull_request.head.repo.fork == false
        run: pixi run notebook-tests
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}

  cli-python:
    name: cli-python · ${{ matrix.platform }}
    if: github.event.pull_request.head.repo.fork == false && inputs.core_only != true
    environment: crysta-sdk
    # After the core tests, which take the runners first; a core failure cancels the run before these start.
    needs: [changes, core]
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
            sdk: linux-64
          - platform: macOS
            runner: *macos
            sdk: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Build the native code
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Execute the CLI projects through python -m edi fit
        run: pixi run cli-projects
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}

  cli-native:
    name: cli-native · ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch'
    needs: changes
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
          - platform: macOS
            runner: *macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Native CLI placeholder
        run: echo "Placeholder - the native easydiffraction CLI route is not yet exercised; the CLI projects run only through python -m edi fit (cli-python)."

  docs:
    name: docs
    if: github.event.pull_request.head.repo.fork == false && inputs.core_only != true
    environment: crysta-sdk
    # After the core tests, which take the runners first; a core failure cancels the run before these start.
    needs: [changes, core]
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    runs-on: *linux
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Prepare notebooks
        run: pixi run notebook-prepare
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Build the native code
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Execute notebooks for rendering
        run: pixi run notebook-exec-ci
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Strict docs build
        run: pixi run docs-build

  app:
    name: app · ${{ matrix.platform }}
    if: github.event.pull_request.head.repo.fork == false && inputs.core_only != true
    environment: crysta-sdk
    # After the core tests, which take the runners first; a core failure cancels the run before these start.
    needs: [changes, core]
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: *linux
            sdk: linux-64
          - platform: macOS
            runner: *macos
            sdk: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the app's version line is `git describe`
      - uses: ./.github/actions/setup-pixi
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Prepare the persistent build caches
        run: |
          echo "CCACHE_DIR=$HOME/.cache/edi-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/edi-ccache"
          CCACHE_DIR="$HOME/.cache/edi-ccache" pixi run -e app ccache --zero-stats
      - name: Build the native code
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Build the app host, the test runner and the image comparator
        run: pixi run -e app app-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Compiler cache statistics
        run: pixi run -e app ccache --show-stats
      - name: qmllint over edi's QML (zero warnings)
        run: pixi run -e app --skip-deps app-lint
      - name: qmlformat changes nothing
        run: pixi run -e app --skip-deps app-format-check
      - name: The app's Qt Quick Test tier
        if: false
        run: pixi run -e app --skip-deps app-test
      - name: The app group's Python tests (tests/integration/app)
        run: pixi run --skip-deps group-app
      - name: The UI test against the one committed image set
        if: false
        run: pixi run -e app --skip-deps app-ui-test
      - name: Upload the UI test's images and similarity maps
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-${{ matrix.platform }}
          path: |
            build/app/ui-actual
            build/app/ui-diff
          if-no-files-found: ignore
      - name: app-build recovers a build/app configured under another toolchain
        if: needs.changes.outputs.app_build == 'true'
        run: pixi run -e app --skip-deps app-build-recovery
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}

  # The app as a WebAssembly site (ADR-0023): both Qt wasm kits, the start page and the service-worker shim,
  # packed as one site folder and uploaded as the `edi-webapp` artifact. The toolchain (Emscripten, Qt's wasm
  # kits, Eigen, Chrome) installs into the runner's ~/.cache/edi-wasm on each run. crysta is compiled for
  # wasm from the pinned SDK's source, per kit.
  app-wasm:
    name: app · WebAssembly
    if: github.event.pull_request.head.repo.fork == false && inputs.core_only != true
    environment: crysta-sdk
    # After the core tests, which take the runners first; a core failure cancels the run before these start.
    needs: [changes, core]
    runs-on: *linux
    env:
      CRYSTA_SOURCE_SHA: ${{ needs.changes.outputs.crysta_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the app's version line is `git describe`
      - uses: ./.github/actions/setup-pixi
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      # The pinned crysta SDK and its source (the wasm builds compile that source), and the native build the
      # checks' tests import.
      - name: Build the native code
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Install the WebAssembly toolchain  # Emscripten, Qt's wasm kits, Eigen, Chrome
        run: pixi run -e app wasm-toolchain
      - name: Build both kits and pack the site
        run: pixi run -e app --skip-deps wasm-build
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: edi-webapp
          path: build/wasm/site
          if-no-files-found: error
          # The repository's default retention: the site is downloaded by hand.
      # The wasm crysta CLI's fit against the native reference, the zip's contents, and the app in headless
      # Chrome for each build.
      - name: Check the site in the browser
        run: >-
          pixi run --skip-deps wasm-check "$RUNNER_TEMP/edi-webapp-checks" tests/system/manual/e04_t11_browser.mjs
          tests/system/py/test_e04_t11_wasm_fit.py tests/system/py/test_e04_t11_wasm_delivery.py
      - name: Upload the browser checks' screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edi-webapp-checks
          path: ${{ runner.temp }}/edi-webapp-checks
          retention-days: 7
          if-no-files-found: ignore
