name: WebAssembly caches
description: >-
  Restore the pinned browser toolchain and compiler outputs. The job saves them itself with the store action under the
  keys this gives.
outputs:
  objects:
    description: The key to save the compiler outputs under
    value: ${{ steps.keys.outputs.objects }}
  toolchain:
    description: The key to save the toolchain under
    value: ${{ steps.keys.outputs.toolchain }}
  toolchain-hit:
    description: Whether the toolchain was restored, so there is nothing to save
    value: ${{ steps.toolchain.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: compiler
      uses: ./.github/actions/ccache
      with:
        max-size: 2G
    - id: keys
      shell: bash
      run: |
        echo "objects=ccache2-wasm-${{ steps.compiler.outputs.key-prefix }}${{ hashFiles('tools/ci/wasm-env.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_OUTPUT"
        echo "toolchain=edi-wasm2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/wasm-env.sh', 'tests/fixtures/web_parallel/package-lock.json') }}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      with:
        path: ~/.cache/edi-ccache
        key: ${{ steps.keys.outputs.objects }}
        restore-keys: |
          ccache2-wasm-${{ steps.compiler.outputs.key-prefix }}${{ hashFiles('tools/ci/wasm-env.sh') }}-
          ccache2-wasm-${{ steps.compiler.outputs.key-prefix }}
          ccache2-wasm-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/cache/restore@v4
      id: toolchain
      with:
        path: ~/.cache/edi-wasm
        key: ${{ steps.keys.outputs.toolchain }}
