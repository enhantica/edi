name: Feature request
description: Suggest a new feature or a change to one
labels: ['✨ enhancement', '⚠️ priority needed']
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      description: Describe what you are trying to do before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: Your idea, and any other ways you thought of.
