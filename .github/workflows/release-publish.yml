name: Publish release

on:
  workflow_dispatch:
    inputs:
      installer_run:
        description: Desktop installers run ID qualified on main with release_plan_run
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'enhantica/edi' && github.event.pull_request.head.repo.fork == false
    environment: crysta-sdk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    defaults:
      run:
        shell: python3 tools/ci/public_log.py {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check the distribution builder on a fixture release
        shell: bash
        run: python tools/release/distribution.py --dry-run --output dry-run
      - name: Stage immutable qualified artifacts
        shell: bash
        run: python tools/release/promote.py --repo "$GITHUB_REPOSITORY" --run "$INSTALLER_RUN" --output publication
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN: ${{ inputs.installer_run }}
      # An app reading the legacy stable.json sees later YY.N releases only as 2026.11.x aliases, which it ranks
      # below its own version, so a YY.N release must be built from a commit whose app reads stable-v2.json.
      - name: Check that the release's app reads the newer feed
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("publication/release.json"))["version"])')
          commit=$(python3 -c 'import json; print(json.load(open("publication/release.json"))["commit"])')
          if [[ "$version" =~ ^[0-9]{2}\.[0-9]+$ ]]; then
            updates=$(git show "$commit:app/src/desktop_updates.cpp")
            if [[ "$updates" != *'releases/stable-v2.json'* ]]; then
              echo "::error::The app at $commit reads releases/stable.json; build $version from a commit whose app reads stable-v2.json"
              exit 1
            fi
          fi
      # The crysta SDKs every product of this release was built with (edi ADR-0083), attached beside them.
      - name: The pinned crysta commit
        id: crysta
        shell: bash
        run: bash tools/ci/crysta-source.sh
      # The SDK artifacts are edi-crysta-sdk-<platform>, crysta-sdk-<platform> in runs made before that
      # name; neither form takes the red summaries (crysta-sdk-red-...).
      - uses: actions/download-artifact@v4
        with:
          pattern: '*crysta-sdk-[low]*'
          path: crysta-sdk-archives
          merge-multiple: true
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ github.token }}
      - name: Attach the crysta SDKs
        env:
          SHA: ${{ steps.crysta.outputs.sha }}
        shell: bash
        run: |
          for platform in linux-64 osx-arm64 win-64; do
            cp "crysta-sdk-archives/crysta-sdk-$SHA-$platform.tar.gz" publication/assets/
          done
      # The web app Pages built from the release commit, as one archive beside the installers.
      - name: Attach the web app
        shell: bash
        run: python tools/release/webapp_archive.py --repo "$GITHUB_REPOSITORY" --publication publication
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write and check the three copies of the release
        shell: bash
        run: python tools/release/distribution.py --publication publication --output copies --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      # Apps up to v2026.11.31 read stable.json and drop it whole for one YY.N version, so it holds the
      # newest release under an alias they accept (tools/release/legacy_feed.py). The feed bases serve what
      # enhantica/edi-download writes from the release-history.json asset with write_feeds, so build the
      # same here: a feed those apps would drop stops the release, and the log shows what they list.
      - name: Check the update feeds the feed bases will serve
        shell: bash
        run: |
          python tools/release/legacy_feed.py write --history copies/release/release-history.json --output "$RUNNER_TEMP/feeds"
          python tools/release/legacy_feed.py check "$RUNNER_TEMP/feeds/stable.json"
      - name: Attach every file of the release copy, component archives and SHA256SUMS included
        shell: bash
        run: |
          rm -rf publication/assets
          cp -R copies/release publication/assets
      - name: The receipts of the installers' checked content
        uses: actions/download-artifact@v4
        with:
          pattern: installer-source-check-*
          path: source-checks
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ github.token }}
      - name: crysta's source, whose lines no later step prints or stores
        uses: ./.github/actions/crysta-source
        with:
          sha: ${{ steps.crysta.outputs.sha }}
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.CRYSTA_READ_KEY }}
          history: 'true'
          receipts: source-checks
      - name: Check every file that is published
        run: python3 tools/ci/stored_source.py --receipt source-checks publication copies
      - name: Keep the off-GitHub copy for download.easydiffraction.org
        uses: ./.github/actions/store
        with:
          artifact: offsite-${{ github.run_attempt }}
          receipt: source-checks
          path: copies/offsite
          retention-days: 90
      - name: Prepare the release draft and verify its assets
        run: python tools/release/publish_assets.py --repo "$GITHUB_REPOSITORY" --folder publication
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the verified download assets
        run: python tools/release/publish_assets.py --repo "$GITHUB_REPOSITORY" --folder publication --finalize
        env:
          GH_TOKEN: ${{ github.token }}
      # A run that fails or is cancelled before publishing deletes the release's draft, so no draft is left holding
      # the version (edi ADR-0071); a run of this workflow makes the draft again.
      - name: Delete the draft of a failed publication
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f publication/release.json ]; then
            commit=$(python3 -c 'import json; print(json.load(open("publication/release.json"))["commit"])')
            python tools/release/prepare.py --repo "$GITHUB_REPOSITORY" --source "$commit" --withdraw stable
          fi
      # The tag publish_assets.py gave the release, for the download repositories below.
      - name: The published release tag
        id: tag
        run: echo "tag=v$(python3 -c 'import json; print(json.load(open("publication/release.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Refresh the public release notes
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f component=docs
        env:
          GH_TOKEN: ${{ github.token }}
      # app.easydiffraction.org carries released web apps only: this release's own archive, whose build.json names it.
      - name: Mint a token for edi-sites
        id: sites-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.CRYSTA_READ_KEY }}
          owner: enhantica
          repositories: edi-sites
      - name: Unpack the released web app
        run: |
          rm -rf released-webapp
          mkdir released-webapp
          unzip -q publication/assets/EasyDiffraction-*-webapp.zip -d released-webapp
      - name: Check the released web app
        run: python3 tools/ci/stored_source.py released-webapp
      - name: Put the released web app on app.easydiffraction.org
        env:
          SITES_TOKEN: ${{ steps.sites-token.outputs.token }}
        run: bash tools/ci/push_deploy_branch.sh released-webapp/webapp deploy-app
      # Last: the Windows online installer and the filled-in text for Microsoft's SmartScreen file submission, with the
      # steps on the run's summary page (edi ADR-0091). The release is out by now, so nothing here may fail it.
      - name: Prepare the SmartScreen submission
        if: success()
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 tools/release/smartscreen.py --publication publication --repo "$REPO" --output smartscreen-submission \
            || echo "::warning::The SmartScreen submission could not be prepared; submit by hand if needed."
      - name: Keep the SmartScreen submission files
        if: success()
        continue-on-error: true
        uses: ./.github/actions/store
        with:
          artifact: smartscreen-submission
          receipt: source-checks
          path: smartscreen-submission
          if-no-files-found: warn
          retention-days: 30

  # download.easydiffraction.org's update repositories come from enhantica/edi-download, which rebuilds them from a
  # published release (edi ADR-0071): every release asks it for its own, so users get the update as soon as the
  # release is out rather than after the next nightly run.
  publish-downloads:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.repository == 'enhantica/edi' && github.event.pull_request.head.repo.fork == false
    environment: public-site
    runs-on: ubuntu-24.04
    steps:
      - name: Mint a token for edi-download
        id: download-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.CRYSTA_READ_KEY }}
          owner: enhantica
          repositories: edi-download
      - name: Publish this release's download repositories
        env:
          GH_TOKEN: ${{ steps.download-token.outputs.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh workflow run publish.yml --repo enhantica/edi-download --ref main -f tag="$TAG"
