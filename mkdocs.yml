# edi documentation — MkDocs (strict). Two audiences: docs/user/ for people who use
# edi, docs/dev/ for people who build it; the subtle bottom-right audience switcher
# joins them.
site_name: edi
site_description: "Diffraction data analysis"
# Where GitHub Pages publishes the site once the repository is public (the Pages workflow).
site_url: https://enhantica.github.io/edi/
repo_url: https://github.com/enhantica/edi
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

# The navigation is EXPLICIT: a CLI project's page counts as documented only when it is listed
# here, never because its file exists — and `omitted_files: warn` under --strict makes a page left
# out of this list a docs-build failure rather than a page that silently vanishes.
