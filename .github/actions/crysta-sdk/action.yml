name: crysta SDK
description: >-
  Download this run's qualified SDK from .github/workflows/crysta-sdk.yml
  (edi ADR-0083), and point the build at them. A job using it needs the crysta-sdk job.
inputs:
  platform:
    description: linux-64, osx-arm64 or win-64
    required: true
  diagnostic:
    description: Take the SDK of a manual run of another commit (crysta-diagnostic.yml), named so
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: crysta-sdk-${{ inputs.platform }}${{ inputs.diagnostic == 'true' && '-diagnostic' || '' }}
        path: crysta-sdk-archives
    - shell: bash
      run: echo "CRYSTA_SDK_ARCHIVES=$GITHUB_WORKSPACE/crysta-sdk-archives" >>"$GITHUB_ENV"
