name: crysta SDK
description: >-
  Download this run's qualified SDK and source from .github/workflows/crysta-sdk.yml
  (edi ADR-0083), and point the build at them. A job using it needs the crysta-sdk job.
inputs:
  platform:
    description: linux-64 or osx-arm64
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: crysta-sdk-${{ inputs.platform }}
        path: crysta-sdk-archives
    - shell: bash
      run: echo "CRYSTA_SDK_ARCHIVES=$GITHUB_WORKSPACE/crysta-sdk-archives" >>"$GITHUB_ENV"
