site_name: EasyDiffraction
site_description: Diffraction analysis, your way. Application, Python and command line in one place.
site_url: http://127.0.0.1:8873/
docs_dir: docs
site_dir: site
theme:
  variant: modern
  custom_dir: overrides
  logo: assets/logo-light.svg
  favicon: assets/icon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
extra_css:
  - assets/brand-colors.css?v=1
  - assets/wordmark.css?v=header-2
  - assets/site-components.css?v=interface-nav-3
  - assets/experiment-tags.css?v=2
  - assets/parameter-reference.css?v=3
extra_javascript:
  - assets/example-catalogue.js?v=1
extra:
  interface_icons:
    Application: [fa5/desktop]
    Web application: [fa5/globe]
    Web app: [fa5/globe]
    Desktop application: [fa5/desktop]
    Desktop app: [fa5/desktop]
    Python: [simple/python]
    Command Line: [fa5/terminal]
    Standalone executable: [fa5/terminal]
    Python package: [simple/python]
    Python scripts: [simple/python]
    Jupyter notebooks: [simple/jupyter]
  section_icons:
    Diffraction model: atom
    Peak profiles: shapes
    Intensity corrections: sliders-h
    Experiment model: microscope
    Refinement and statistics: calculator
  workflow_icons:
    Project: archive
    Structure: layer-group
    Experiment: microscope
    Analysis: calculator
    Report: clipboard-list
