# The pattern chart's latency bank, measured on the self-hosted fleet whose runners the bank names.
# Dispatched by a maintainer only: no pull request, fork or push reaches the fleet.
name: Bank latency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The crysta SDK, built once per crysta commit (edi ADR-0083).
  crysta-sdk:
    uses: ./.github/workflows/crysta-sdk.yml
    secrets: inherit

  bank:
    needs: crysta-sdk
    name: bank · ${{ matrix.platform }}
    # Only in the canonical public repository, named enhantica/edi at the cutover
    # (docs/dev/public-release-checklist.md): the bank runs on the fleet's self-hosted runners.
    if: github.repository == 'enhantica/edi' && github.event_name == 'workflow_dispatch'
    environment: crysta-sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: [self-hosted, Linux, X64]
          - platform: macOS
            runner: [self-hosted, macOS, ARM64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - uses: ./.github/actions/crysta-sdk
        with:
          platform: ${{ runner.os == 'macOS' && 'osx-arm64' || 'linux-64' }}
      - name: Build the native code
        run: pixi run core-build
      - name: Bank this runner's latency medians
        run: pixi run --skip-deps python tools/ci/latency_bank.py --run --out "$RUNNER_TEMP/latency-bank-rows.json"
      - name: Upload the bank rows
        uses: actions/upload-artifact@v5
        with:
          name: latency-bank-${{ matrix.platform }}
          path: ${{ runner.temp }}/latency-bank-rows.json
          overwrite: true
