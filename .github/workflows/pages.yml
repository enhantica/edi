# The documentation site on GitHub Pages, with the web app at /webapp/. The site is built from main (or
# by dispatch) with the notebooks executed for rendering, which needs crysta's SDK; the web app is built
# as CI's `app · WebAssembly` job builds it and placed into the site (ADR-0023).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    if: github.event.pull_request.head.repo.fork == false
    environment: crysta-sdk
    runs-on: &linux ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pixi
      - name: Prepare notebooks
        run: pixi run notebook-prepare
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
          permission-actions: read
      - name: Build the native code
        run: pixi run core-build
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Execute notebooks for rendering
        run: pixi run notebook-exec-ci
        env:
          GITHUB_TOKEN: ${{ steps.crysta-token.outputs.token }}
      - name: Strict docs build
        run: pixi run docs-build
      - name: Install the WebAssembly toolchain  # Emscripten, Qt's wasm kits, Eigen, Chrome
        run: pixi run -e app wasm-toolchain
      - name: Build both kits and pack the web app
        run: pixi run -e app --skip-deps wasm-build
      - name: Place the web app at /webapp/
        run: bash tools/ci/docs-webapp.sh build/wasm/site site
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy the site
    needs: build
    # A Pages site is publicly visible, so it deploys only while the repository is public.
    if: github.event.repository.private == false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: *linux
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
