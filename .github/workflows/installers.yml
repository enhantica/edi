name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run a Windows diagnostic without publishing or qualifying a release
        default: false
        type: boolean
      publish_components:
        description: Publish tested components to the Pages testing repository
        required: true
        default: false
        type: boolean
      calendar_preview:
        description: Build a calendar-versioned macOS and Linux testing preview
        default: false
        type: boolean
      preview_run:
        description: Completed installer run with qualified macOS and Linux artifacts for a testing prerelease
        required: false
        type: string
      release_plan_run:
        description: Successful Prepare calendar release run at this exact source (empty for testing)
        required: false
        type: string
      crysta_commit:
        description: Exact crysta source commit to build before edi
        required: true
        default: 122f77fa46e1143749a4039f65b24438006bb482
        type: string
  push:
    paths:
      - .github/workflows/installers.yml
      - .github/actions/setup-pixi/action.yml
      - tools/installer/**
      - cmake/assistant_runtime*
      - app/src/installer_smoke.cpp

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-installers-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  installers:
    if: inputs.preview_run == ''
    name: installer · ${{ matrix.platform }}
    environment: crysta-sdk
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"platform":"Windows","runner":"windows-2022"}]' || (inputs.calendar_preview && '[{"platform":"Linux","runner":"ubuntu-24.04"},{"platform":"macOS","runner":"macos-15"}]') || '[{"platform":"Linux","runner":"ubuntu-24.04"},{"platform":"macOS","runner":"macos-15"},{"platform":"Windows","runner":"windows-2022"}]') }}
    env:
      CRYSTA_SOURCE_COMMIT: ${{ inputs.crysta_commit || '122f77fa46e1143749a4039f65b24438006bb482' }}
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      EDI_RELEASE_PLAN: ${{ inputs.release_plan_run && format('{0}/build/release-plan', github.workspace) || '' }}
      EDI_INSTALLER_VERSION: 0.0.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Select a unique testing calendar version
        if: inputs.calendar_preview
        shell: bash
        env:
          RELEASE_PLAN_RUN: ${{ inputs.release_plan_run }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
        run: |
          if [[ -n "$RELEASE_PLAN_RUN" || "$WINDOWS_ONLY" == true ]]; then
            echo "A calendar preview is separate from stable qualification and Windows diagnostics."
            exit 1
          fi
          version="$(date -u +%Y.%m).$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))"
          printf 'EDI_INSTALLER_VERSION=%s\nEDI_INSTALLER_PREVIEW_VERSION=%s\n' "$version" "$version" >> "$GITHUB_ENV"
      - name: Reject publication inputs for a Windows diagnostic
        if: inputs.windows_only && (inputs.publish_components || inputs.release_plan_run != '')
        shell: bash
        run: |
          echo "Windows diagnostics cannot publish or qualify a release."
          exit 1
      - name: Enable long source paths on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.protectNTFS false
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'
        with:
          fetch-depth: 0
      - name: Check out Windows-compatible source paths
        if: runner.os == 'Windows'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !**/[aA][uU][xX]
            !**/[aA][uU][xX].*
            !**/[cC][oO][nN]
            !**/[cC][oO][nN].*
            !**/[pP][rR][nN]
            !**/[pP][rR][nN].*
            !**/[nN][uU][lL]
            !**/[nN][uU][lL].*
            !**/[cC][oO][mM][1-9]
            !**/[cC][oO][mM][1-9].*
            !**/[lL][pP][tT][1-9]
            !**/[lL][pP][tT][1-9].*
      - name: Set up the locked packaging environment
        uses: ./.github/actions/setup-pixi
        with:
          manifest-path: tools/installer/pixi.toml
      - name: Set up the Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Acquire source-bound release inputs
        if: inputs.release_plan_run != ''
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/release/download_plan.py" --repo "$GITHUB_REPOSITORY" --run "$PREPARE_RUN" --output "$EDI_RELEASE_PLAN"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN: ${{ inputs.release_plan_run }}
      - name: Validate calendar release policy offline
        run: pixi run --manifest-path tools/installer/pixi.toml python -m pytest "${{ github.workspace }}/tests/fixtures/releases" --noconftest -o addopts= -q
      - name: Check installer boundaries and native UTC conversion offline
        run: pixi run --manifest-path tools/installer/pixi.toml python -m pytest "${{ github.workspace }}/tests/fixtures/installer" --noconftest -o addopts= -q
      - name: Acquire the pinned Qt Installer Framework
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" tools --output "${{ github.workspace }}/build/installer/ifw"
      - name: Check installer transport before building the application
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/protocol_check.py" --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/protocol"
      - name: Require an immutable engine source
        shell: bash
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import os, re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['CRYSTA_SOURCE_COMMIT']):
              raise RuntimeError('Installer qualification requires a complete engine commit')
          PYTHON
      - name: Mint a crysta installation token
        id: crysta-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: crysta
          permission-contents: read
      - name: Check out crysta source
        uses: actions/checkout@v5
        with:
          repository: enhantica/crysta
          ref: ${{ env.CRYSTA_SOURCE_COMMIT }}
          token: ${{ steps.crysta-token.outputs.token }}
          path: .crysta
          persist-credentials: false
      - name: Check engine compiler portability before the full build
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/build.py" --check-compiler --crysta-source "${{ github.workspace }}/.crysta" --work "${{ github.workspace }}/build/installer"
      - name: Build crysta, edi and its runtime bundle
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/build.py" --crysta-source "${{ github.workspace }}/.crysta" --work "${{ github.workspace }}/build/installer"
      - name: Check assistant process-family shutdown on this platform
        shell: bash
        run: |
          pixi run --manifest-path tools/installer/pixi.toml cmake --build build/installer/app --target edi_assistant_lifetime_host --parallel 4
          pixi run --manifest-path tools/installer/pixi.toml python -m pytest "${{ github.workspace }}/tests/fixtures/assistant_fixes/test_process_lifetime.py" --noconftest -o addopts= -q --junitxml=build/installer/assistant-lifetime.xml
        env:
          EDI_LIFETIME_BIN_DIR: ${{ github.workspace }}/build/installer/app/app
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Check retired project ownership before packaging
        shell: bash
        run: |
          pixi run --manifest-path tools/installer/pixi.toml cmake --build build/installer/app --target edi_trial_lock_tests --parallel 4
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          binary = Path('build/installer/app/app') / ('edi_trial_lock_tests.exe' if os.name == 'nt' else 'edi_trial_lock_tests')
          subprocess.run([str(binary.resolve()), '-o', 'build/installer/project-retirement.xml,junitxml'], check=True)
          PYTHON
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Create the offline qualification installer
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" package --stage "${{ github.workspace }}/build/installer/stage" --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/package"
      - name: Install, launch, calculate, render and uninstall
        shell: bash
        run: |
          installer=$(cat build/installer/package/installer.json | sed -n 's/.*"zip": "\([^"]*\)".*/\1/p')
          pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" test --installer "${{ github.workspace }}/build/installer/package/$installer" --output "${{ github.workspace }}/build/installer/test"
      - name: Create the online distribution installer
        run: pixi run --manifest-path tools/installer/pixi.toml python "${{ github.workspace }}/tools/installer/package.py" package --kind online --stage "${{ github.workspace }}/build/installer/stage" --tools "${{ github.workspace }}/build/installer/ifw/tools" --output "${{ github.workspace }}/build/installer/online"
      - name: Qualify the online ZIP with local component transport
        shell: bash
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          root = Path.cwd()
          package = root / 'build/installer/online'
          metadata = json.loads((package / 'installer.json').read_text())
          subprocess.run([
              'python', str(root / 'tools/installer/package.py'), 'test',
              '--installer', str(package / metadata['zip']),
              '--repository', (package / 'repository').as_uri() + '/',
              '--output', str(root / 'build/installer/online-test'),
          ], check=True)
          subprocess.run([
              'python', str(root / 'tools/installer/package.py'), 'test',
              '--installer', str(package / metadata['zip']),
              '--repository', (package / 'repository').as_uri() + '/',
              '--output', str(root / 'build/installer/online-assistant-test'),
              '--with-assistant',
          ], check=True)
          PYTHON
      - name: Prepare the tested platform repository
        shell: bash
        run: |
          pixi run --manifest-path tools/installer/pixi.toml python - <<'PYTHON'
          import json, shutil
          from pathlib import Path
          package = Path('build/installer/online')
          metadata = json.loads((package / 'installer.json').read_text())
          import os
          channel = 'stable' if os.environ.get('EDI_RELEASE_PLAN') else 'testing'
          target = Path('build/installer/components') / channel / metadata['platform']
          shutil.copytree(package / 'repository', target)
          delivery = Path('build/installer/delivery')
          delivery.mkdir()
          os.link(package / metadata['zip'], delivery / metadata['zip'])
          shutil.copy2(package / 'installer.json', delivery / 'installer.json')
          shutil.copy2('build/installer/stage/build-inputs.json', delivery / 'build-inputs.json')
          shutil.copy2('build/installer/online-test/passed.json', delivery / 'qualification.json')
          preview_history = Path('build/installer/preview-history.json')
          if preview_history.is_file():
              shutil.copy2(preview_history, delivery / 'preview-history.json')
          PYTHON
      - name: Upload online installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ github.run_attempt }}
          path: build/installer/delivery
          if-no-files-found: error
          compression-level: 0
      - name: Upload tested components
        uses: actions/upload-artifact@v4
        with:
          name: installer-components-${{ matrix.platform }}-${{ github.run_attempt }}
          path: build/installer/components
          if-no-files-found: error
          compression-level: 0
      - name: Upload installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-check-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            build/installer/assistant-lifetime.xml
            build/installer/project-retirement.xml
            build/installer/test/*.log
            build/installer/test/*.json
            build/installer/test/smoke/**
            build/installer/online-test/*.log
            build/installer/online-test/*.json
            build/installer/online-test/smoke/**
            build/installer/online-assistant-test/*.log
            build/installer/online-assistant-test/*.json
            build/installer/online-assistant-test/smoke/**
            build/installer/online/installer.json
            build/installer/stage/bundle-audit.json
            build/installer/protocol/*.log
            build/installer/protocol/passed.json
            build/installer/package/installer.json
          if-no-files-found: ignore

  qualify-release:
    name: record qualified release inputs
    needs: installers
    if: inputs.release_plan_run != '' && !inputs.windows_only && !inputs.calendar_preview && inputs.preview_run == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Recover the exact prepared inputs
        run: python tools/release/download_plan.py --repo "$GITHUB_REPOSITORY" --run "$PREPARE_RUN" --output release-plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN: ${{ inputs.release_plan_run }}
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-release-plan-${{ github.run_attempt }}
          path: release-plan
          if-no-files-found: error
          retention-days: 90

  publish-installers:
    name: publish tested installer components
    needs: installers
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.windows_only
      && inputs.publish_components && inputs.release_plan_run == '' && !github.event.repository.private
      && (needs.installers.result == 'success' || (inputs.preview_run != '' && needs.installers.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Download tested platform repositories
        if: inputs.preview_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: installer-components-*-${{ github.run_attempt }}
          merge-multiple: true
          path: components
      - name: Recover qualified macOS and Linux preview repositories
        if: inputs.preview_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
        run: |
          python3 tools/release/preview.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" \
            --run "$PREVIEW_RUN" --output preview
          mv preview/components components
      - name: Require the selected platforms from this successful attempt
        if: inputs.preview_run == ''
        env:
          CALENDAR_PREVIEW: ${{ inputs.calendar_preview }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          root = Path('components/testing')
          expected = {'linux-x86_64', 'macos-arm64'}
          if os.environ['CALENDAR_PREVIEW'] != 'true':
              expected.add('windows-x86_64')
          if not root.is_dir() or {item.name for item in root.iterdir()} != expected:
              raise RuntimeError('Publish requires all platforms from one complete successful attempt; rerun all jobs')
          for platform in expected:
              if not (root / platform / 'Updates.xml').is_file():
                  raise RuntimeError('Platform repository metadata is missing')
          PYTHON
      - name: Download installed calendar preview identities
        if: inputs.calendar_preview && inputs.preview_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*-${{ github.run_attempt }}
          path: preview-delivery
      - name: Prepare the testing update feed
        if: inputs.calendar_preview && inputs.preview_run == ''
        run: |
          python3 - <<'PYTHON'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('components/testing')
          histories = sorted(Path('preview-delivery').glob('installer-*/preview-history.json'))
          if len(histories) != 2 or histories[0].read_bytes() != histories[1].read_bytes():
              raise RuntimeError('Preview release histories differ')
          payload = histories[0].read_bytes()
          version = json.loads(payload)['releases'][0]['version']
          for metadata in root.glob('*/Updates.xml'):
              versions = {item.findtext('Version') for item in ET.parse(metadata).findall('PackageUpdate')}
              if versions != {version}:
                  raise RuntimeError('Testing repositories do not match the preview feed')
          (root / 'feed.json').write_bytes(payload)
          PYTHON
      - name: Preserve documentation, web app and previous components
        run: python3 tools/ci/pages_update.py --repo "$GITHUB_REPOSITORY" --component installers --incoming components --site site
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the assembled site
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-site-installers-${{ github.run_attempt }}
          path: site
          retention-days: 90
      - name: Deploy installers to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-site-installers-${{ github.run_attempt }}
