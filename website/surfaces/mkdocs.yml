site_name: EasyDiffraction
site_description: Diffraction analysis, your way. Application, Python and command line in one place.
site_url: http://127.0.0.1:8873/
docs_dir: docs
site_dir: site
theme:
  variant: modern
  custom_dir: overrides
  logo: assets/logo-light.svg
  favicon: assets/icon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
extra_css:
  - assets/brand-colors.css?v=1
  - assets/wordmark.css?v=header-2
  - assets/site-components.css?v=release-notes-1
  - assets/experiment-tags.css?v=2
  - assets/parameter-reference.css?v=3
extra_javascript:
  - assets/example-catalogue.js?v=1
extra:
  interface_icons:
    Application: [lucide/monitor]
    Web application: [lucide/globe]
    Web app: [lucide/globe]
    Desktop application: [lucide/monitor]
    Desktop app: [lucide/monitor]
    Python: [simple/python]
    Command Line: [lucide/square-terminal]
    Standalone executable: [lucide/square-terminal]
    CLI from Python package: [simple/python]
    Python scripts: [simple/python]
    Jupyter notebooks: [simple/jupyter]
  section_icons:
    Foundations: book-open-variant
    Analysis workflow: routes
    Start here: compass-outline
    Peak profiles: chart-bell-curve
    Intensity corrections: tune
    Experiment model: microscope
    Refinement and statistics: chart-scatter-plot
    Reference: book-search-outline
  workflow_icons:
    Project: archive
    Structure: puzzle
    Experiment: microscope
    Analysis: calculator
    Report: clipboard-text
