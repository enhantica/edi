# Dependency-only lock coverage. This does not enable the Windows Edi app/toolchain.
[workspace]
name = "edi-assistant-packages"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
requires-pixi = "==0.76.2"
preview = ["pixi-build"]

[dependencies]
edi-assistant-runtime = { path = "../assistant-runtime" }
edi-assistant-math-source = { path = "../assistant-math" }
